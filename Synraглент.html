<script>
  (function () {
    // Keep the app shell locked to the layout viewport on mobile.
    // Keyboard open/close must not change its height or vertical offset.
    // Capture the layout viewport once. Never recalculate it when the keyboard opens/closes.
    // This keeps the shell and its input row at the same vertical position on iPhone/Android.
    var lockedHeight = Math.ceil(document.documentElement.clientHeight || window.innerHeight);
    document.documentElement.style.setProperty("--app-height", lockedHeight + "px");
    document.documentElement.style.setProperty("--app-offset-top", "0px");
    window.addEventListener("orientationchange", function () {
      setTimeout(function () {
        var h = Math.ceil(document.documentElement.clientHeight || window.innerHeight);
        document.documentElement.style.setProperty("--app-height", h + "px");
      }, 250);
    });
  })();
</script>

/* ---------- lightweight markdown-style rendering for assistant replies ---------- */

function formatInline(text, keyPrefix) {
  const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter((p) => p !== "");
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={`${keyPrefix}-b-${i}`}>{part.slice(2, -2)}</strong>;
    }
    if (part.startsWith("`") && part.endsWith("`")) {
      return (
        <code key={`${keyPrefix}-c-${i}`} className="inline-code">
          {part.slice(1, -1)}
        </code>
      );
    }
    return <span key={`${keyPrefix}-t-${i}`}>{part}</span>;
  });
}

function renderMessageBody(text) {
  const blocks = [];
  const codeRegex = /```([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  let blockIndex = 0;

  const pushTextBlock = (chunk, keyBase) => {
    const lines = chunk.split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
          i++;
        }
        blocks.push(
          <ul className="msg-list" key={`${keyBase}-ul-${i}`}>
            {items.map((it, idx) => (
              <li key={idx}>{formatInline(it, `${keyBase}-ul-${i}-${idx}`)}</li>
            ))}
          </ul>
        );
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
          i++;
        }
        blocks.push(
          <ol className="msg-list" key={`${keyBase}-ol-${i}`}>
            {items.map((it, idx) => (
              <li key={idx}>{formatInline(it, `${keyBase}-ol-${i}-${idx}`)}</li>
            ))}
          </ol>
        );
        continue;
      }
      if (line.trim() === "") {
        i++;
        continue;
      }
      const paraLines = [line];
      i++;
      while (
        i < lines.length &&
        lines[i].trim() !== "" &&
        !/^\s*[-*]\s+/.test(lines[i]) &&
        !/^\s*\d+\.\s+/.test(lines[i])
      ) {
        paraLines.push(lines[i]);
        i++;
      }
      blocks.push(
        <p className="msg-para" key={`${keyBase}-p-${i}`}>
          {paraLines.map((pl, idx) => (
            <span key={idx}>
              {formatInline(pl, `${keyBase}-p-${i}-${idx}`)}
              {idx < paraLines.length - 1 && <br />}
            </span>
          ))}
        </p>
      );
    }
  };

  while ((match = codeRegex.exec(text)) !== null) {
    const before = text.slice(lastIndex, match.index);
    if (before) pushTextBlock(before, `b${blockIndex++}`);
    const codeContent = match[1].replace(/^[a-zA-Z]*\n/, "");
    blocks.push(
      <pre className="msg-code" key={`code-${blockIndex++}`}>
        <code>{codeContent}</code>
      </pre>
    );
    lastIndex = codeRegex.lastIndex;
  }
  const rest = text.slice(lastIndex);
  if (rest) pushTextBlock(rest, `b${blockIndex++}`);

  return blocks;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("read failed"));
    reader.readAsDataURL(file);
  });
}

function getVideoDuration(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const videoEl = document.createElement("video");
    videoEl.preload = "metadata";
    videoEl.onloadedmetadata = () => {
      URL.revokeObjectURL(url);
      resolve(videoEl.duration);
    };
    videoEl.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("video load error"));
    };
    videoEl.src = url;
  });
}

function resizeImageToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      if (width > maxDim || height > maxDim) {
        if (width >= height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("image load error"));
    };
    img.src = url;
  });
}

          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: YANDEX_MODEL,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              ...historyForApi,
            ],
            temperature: 0.3,
            max_tokens: 2000,
            stream: false,
          }),
        });

        const responseText = await response.text();
        let data = null;
        try {
          data = responseText ? JSON.parse(responseText) : null;
        } catch (parseError) {
          console.error("Synra: Yandex GPT вернул невалидный JSON —", parseError, responseText);
        }

        if (!response.ok) {
          const serverMessage =
            (data && data.error && data.error.message) ||
            (data && data.message) ||
            responseText ||
            `HTTP ${response.status}`;
          const error = new Error(`HTTP ${response.status}: ${serverMessage}`);
          error.status = response.status;
          throw error;
        }

        const replyText =
          data &&
          data.choices &&
          data.choices[0] &&
          data.choices[0].message &&
          data.choices[0].message.content;
        if (typeof replyText !== "string" || !replyText.trim()) {
          throw new Error("Yandex GPT вернул пустой ответ или ответ в неожиданном формате.");
        }

        const cleanReplyText = replyText.trim();
        updateChat(chatId, (c) => ({
          ...c,
          messages: [...c.messages, { role: "assistant", text: cleanReplyText }],
        }));
        if (voiceOpen) {
          speakVoiceReply(cleanReplyText);
        }
      } catch (err) {
        console.error("Synra: ошибка запроса к Yandex GPT —", err);
        setLastFailed(text);

        const status = err && err.status;
        let friendly = "Не удалось получить ответ от Яндекс GPT. Проверьте интернет и настройки API.";
        if (status === 401) {
          friendly = "Яндекс GPT отклонил API-ключ (401). Проверьте ключ и его права доступа.";
        } else if (status === 403) {
          friendly = "Доступ к Яндекс GPT запрещён (403). Проверьте роль сервисного аккаунта, область действия API-ключа и YANDEX_FOLDER_ID.";
        } else if (status === 404) {
          friendly = "Модель или каталог не найдены (404). Проверьте YANDEX_FOLDER_ID и название модели.";
        } else if (status === 429) {
          friendly = "Яндекс GPT временно ограничил запросы (429). Попробуйте немного позже.";
        } else if (status >= 500) {
          friendly = "Сервис Яндекс GPT временно недоступен. Попробуйте ещё раз позже.";
        } else if (err instanceof TypeError) {
          friendly = "Браузер не смог выполнить запрос к Яндекс GPT. Если это CORS-ошибка, для публичного сайта потребуется serverless/backend-прокси.";
        }

        setError(friendly);
      } finally {
        setIsLoading(false);
      }
    },
    [activeId, messages, isLoading, pendingAttachment, voiceOpen, speakVoiceReply]
  );

  useEffect(() => {
    sendMessageRef.current = sendMessage;
  }, [sendMessage]);

  useEffect(() => {
    voiceOpenRef.current = voiceOpen;

    const refreshVoices = () => {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return;
      setAvailableVoices(voices);
      const best = pickBestVoiceForLang(voiceLangRef.current);
      if (best) voiceBestVoiceRef.current = best;
    };
    refreshVoices();
    window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
    return () => window.speechSynthesis.removeEventListener("voiceschanged", refreshVoices);
  }, [pickBestVoiceForLang]);

  useEffect(() => {
    voiceLangRef.current = voiceLang;
    if (voiceRecognitionRef.current) {
      try { voiceRecognitionRef.current.lang = VOICE_LANGS[voiceLang] || "ru-RU"; } catch (_) {}
    }
    const best = pickBestVoiceForLang(voiceLang);
    if (best) voiceBestVoiceRef.current = best;
  }, [voiceLang, pickBestVoiceForLang]);

  useEffect(() => { voiceRateRef.current = voiceRate; }, [voiceRate]);
  useEffect(() => { voiceVolumeRef.current = voiceVolume; }, [voiceVolume]);
  useEffect(() => { voiceAutoContinueRef.current = voiceAutoContinue; }, [voiceAutoContinue]);
  useEffect(() => { voiceVoiceURIRef.current = voiceVoiceURI; }, [voiceVoiceURI]);

    clearLongPressTimer();
    longPressTimer.current = setTimeout(() => {
      openMessageMenu(point, chatId, msgIndex, role, text);
    }, 500);
  };

  const handleMsgPointerMove = (e) => {
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    const dx = Math.abs(point.clientX - pressStartPos.current.x);
    const dy = Math.abs(point.clientY - pressStartPos.current.y);
    if (dx > 10 || dy > 10) clearLongPressTimer();
  };

  const handleMsgPointerUp = () => {
    clearLongPressTimer();
  };

  const handleMsgContextMenu = (e, chatId, msgIndex, role, text) => {
    e.preventDefault();
    clearLongPressTimer();
    openMessageMenu(e, chatId, msgIndex, role, text);
  };

  const handleCopyMessage = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (err2) {
        console.error("Synra: copy failed", err2);
      }
    }
    setMessageMenu(null);
  };

  const handleEditMessage = (menu) => {
    updateChat(menu.chatId, (c) => ({
      ...c,
      messages: c.messages.slice(0, menu.msgIndex),
    }));
    setInput(menu.text);
    setMessageMenu(null);
    setTimeout(() => {
      if (textareaRef.current) textareaRef.current.focus();
    }, 50);
  };

  const handleDeleteMessage = (menu) => {
    updateChat(menu.chatId, (c) => ({
      ...c,
      messages: c.messages.filter((_, idx) => idx !== menu.msgIndex),
    }));
    setMessageMenu(null);
  };

  const handleFileSelected = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    const isImage = file.type.startsWith("image/");
    const isVideo = file.type.startsWith("video/");

    if (file.size > 20 * 1024 * 1024) {
      setAttachError("Файл слишком большой (максимум 20 МБ).");
      return;
    }

    setAttachBusy(true);
    setAttachError(null);

    try {
      if (isVideo) {
        const duration = await getVideoDuration(file);
        if (duration > 10.5) {
          setAttachError("Видео можно прикрепить не длиннее 10 секунд.");
          setAttachBusy(false);
          return;
        }
        const dataUrl = await fileToDataUrl(file);
        setPendingAttachment({ type: "video", dataUrl, name: file.name, mime: file.type });
      } else if (isImage) {
        const dataUrl = await resizeImageToDataUrl(file, 1280, 0.82);
        setPendingAttachment({ type: "image", dataUrl, name: file.name, mime: "image/jpeg" });
      } else {
        const dataUrl = await fileToDataUrl(file);
        setPendingAttachment({ type: "file", dataUrl, name: file.name, mime: file.type, size: file.size });
      }
    } catch (err) {
      setAttachError("Не удалось прочитать файл.");
    } finally {
      setAttachBusy(false);
    }
  };

  const startGSRecording = useCallback(async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      setVoiceStatus("Запись ГС не поддерживается этим браузером");
      return;
    }
    if (isRecordingGS) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      const recorder = new MediaRecorder(stream, { mimeType: mime });
      recordingChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) recordingChunksRef.current.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach((track) => track.stop());
        const blob = new Blob(recordingChunksRef.current, { type: mime });
        const url = URL.createObjectURL(blob);
        updateChat(activeId, (c) => ({
          ...c,
          messages: [...c.messages, { role: "user", text: "", attachment: { type: "audio", url, name: "Голосовое сообщение", mime, size: blob.size } }]
        }));
        setIsRecordingGS(false);
      };
      recorder.onerror = () => {
        stream.getTracks().forEach((track) => track.stop());
        setIsRecordingGS(false);
      };
      mediaRecorderRef.current = recorder;
      recorder.start();
      setIsRecordingGS(true);
    } catch (err) {
      console.error("Synra: ошибка записи ГС", err);
      setIsRecordingGS(false);
    }
  }, [activeId, isRecordingGS, updateChat]);

  const stopGSRecording = useCallback(() => {
    const recorder = mediaRecorderRef.current;
    if (recorder && recorder.state !== "inactive") recorder.stop();
    mediaRecorderRef.current = null;
    setIsRecordingGS(false);
  }, []);

  const startVoiceRecognition = useCallback(() => {
    if (typeof window === "undefined") return;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      setVoiceStatus("Голосовой ввод не поддерживается этим браузером");
      return;
    }
    if (voiceSpeakingRef.current) return;

    if (voiceRestartTimerRef.current) {
      clearTimeout(voiceRestartTimerRef.current);
      voiceRestartTimerRef.current = null;
    }

    if (!voiceRecognitionRef.current) {
      const recognition = new Recognition();
      recognition.lang = VOICE_LANGS[voiceLangRef.current] || "ru-RU";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        voiceGotResultRef.current = false;
        setVoiceListening(true);
        setVoiceStatus("Слушаю…");
      };

      recognition.onresult = (event) => {
        const transcript = event.results && event.results[0] && event.results[0][0] && event.results[0][0].transcript ? String(event.results[0][0].transcript).trim() : "";
        if (!transcript) return;
        voiceGotResultRef.current = true;
        setVoiceListening(false);
        setVoiceStatus("Отправляю…");
        voiceManuallyStoppedRef.current = false;
        if (sendMessageRef.current) sendMessageRef.current(transcript);
      };

      recognition.onerror = (event) => {
        setVoiceListening(false);
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          voiceManuallyStoppedRef.current = true;
          setVoiceStatus("Разрешите доступ к микрофону в браузере");
          return;
        }
        if (event.error === "aborted") return;
        // Пауза/тишина и похожие временные ошибки — не прерываем диалог,
        // а тихо продолжаем слушать, как в настоящем голосовом режиме.
        if (voiceOpenRef.current && !voiceManuallyStoppedRef.current && !voiceSpeakingRef.current) {
          setVoiceStatus("Слушаю…");
          voiceRestartTimerRef.current = setTimeout(() => startVoiceRecognition(), 400);
        } else {
          setVoiceStatus("Нажмите на микрофон и говорите");
        }
      };

      recognition.onend = () => {
        setVoiceListening(false);
        if (
          !voiceGotResultRef.current &&
          voiceOpenRef.current &&
          !voiceManuallyStoppedRef.current &&
          !voiceSpeakingRef.current
        ) {
          // Ничего не расслышали — не заставляем нажимать микрофон заново,
          // просто продолжаем слушать дальше.
          voiceRestartTimerRef.current = setTimeout(() => startVoiceRecognition(), 400);
        }
      };

      voiceRecognitionRef.current = recognition;
    }

    voiceManuallyStoppedRef.current = false;
    try {
      voiceRecognitionRef.current.start();
    } catch (_) {
      setVoiceListening(true);
      setVoiceStatus("Слушаю…");
    }
  }, []);

  const stopVoiceRecognition = useCallback(() => {
    voiceManuallyStoppedRef.current = true;
    if (voiceRestartTimerRef.current) {
      clearTimeout(voiceRestartTimerRef.current);
      voiceRestartTimerRef.current = null;
    }
    setVoiceListening(false);
    if (voiceRecognitionRef.current) {
      try { voiceRecognitionRef.current.stop(); } catch (_) {}
    }
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    voiceSpeakingRef.current = false;
    setVoiceStatus("Нажмите на микрофон и говорите");
  }, []);

      stopVoiceRecognition();
      return;
    }
    voiceManuallyStoppedRef.current = false;

  }, [voiceOpen, startVoiceRecognition, stopVoiceRecognition]);

    return () => {
      if (voiceRestartTimerRef.current) clearTimeout(voiceRestartTimerRef.current);

      }
    };
  }, []);

              <button
                className="search-clear-btn"
                onClick={() => setSearchQuery("")}
                aria-label="Очистить поиск"
              >
                <XIcon size={14} />
              </button>
            )}
          </div>
        )}

        <button className="sidebar-search-btn" onClick={() => pushPanel("library")}>
          <ImageIcon size={16} />
          <span>Библиотека</span>
        </button>

        {trimmedQuery && visibleChats.length === 0 && (
          <div className="search-empty">Ничего не найдено</div>
        )}

        {visibleChats.length > 0 && (
          <div className="history">
            <div className="history-label">{trimmedQuery ? "Результаты поиска" : "Недавние"}</div>
            {visibleChats.map((c) => (
              <div
                key={c.id}
                className={`history-item ${c.id === activeId ? "active" : ""}`}
                onClick={() => {
                  setActiveId(c.id);
                  closeSidebarOnMobile();
                }}
                onContextMenu={(e) => {
                  e.preventDefault();
                  handleDeleteChat(c.id);
                }}
              >
                <MessageSquare size={16} />
                <span className="history-item-title">{c.title}</span>
                <button
                  className="history-delete-btn"
                  aria-label={`Удалить чат «${c.title}»`}
                  title="Удалить чат"
                  onClick={(e) => {
                    e.stopPropagation();
                    handleDeleteChat(c.id);
                  }}
                >
                  <TrashIcon size={15} />
                </button>
              </div>
            ))}
          </div>
        )}
        <button className="sidebar-bottom-item" onClick={() => pushPanel("menu")}>
          <SettingsIcon size={18} />
          <span>Настройки и справка</span>
        </button>
      </aside>

      <main className="main">
        <header className="topbar">
          <button
            className="icon-btn"
            onClick={() => setSidebarOpen((s) => !s)}
            aria-label="Переключить меню"
          >
            <Menu size={20} />
          </button>
          <button className="topbar-title" onClick={() => pushPanel("models")}>
            <Spark size={18} />
            <span>{selectedModel.name}</span>
            <ChevronDown size={16} className="chevron" />
          </button>
        </header>

        <div className="scroll-area" ref={scrollRef}>
          {messages.length === 0 ? (
            <div className="welcome">
              <h1 className="greeting">{activeChat.greeting === "Привет," ? "Ваш ход!" : (activeChat.greeting || "Ваш ход!")}</h1>
            </div>
          ) : (
            <div className="messages">
              {messages.map((m, i) => (
                <div key={i} className={`msg-row ${m.role}`}>
                  {m.role === "assistant" && (
                    <div className="avatar">
                      <Spark size={18} />
                    </div>
                  )}
                  <div
                    className={`bubble ${m.role}`}
                    onPointerDown={(e) => handleMsgPointerDown(e, activeChat.id, i, m.role, m.text)}
                    onPointerMove={handleMsgPointerMove}
                    onPointerUp={handleMsgPointerUp}
                    onPointerLeave={handleMsgPointerUp}
                    onPointerCancel={handleMsgPointerUp}
                    onContextMenu={(e) => handleMsgContextMenu(e, activeChat.id, i, m.role, m.text)}
                  >
                    {m.attachment && m.attachment.type === "image" && (
                      <img className="msg-attachment-image" src={m.attachment.dataUrl} alt="" />
                    )}
                    {m.attachment && m.attachment.type === "video" && (
                      <video className="msg-attachment-video" src={m.attachment.dataUrl} controls />
                    )}
                    {m.attachment && m.attachment.type === "file" && (
                      <div className="msg-attachment-file">
                        <FileIcon size={16} />
                        <span>{m.attachment.name}</span>
                      </div>
                    )}
                    {m.attachment && m.attachment.type === "audio" && m.attachment.url && (
                      <audio className="msg-attachment-audio" src={m.attachment.url} controls />
                    )}
                    {m.text ? (m.role === "assistant" ? renderMessageBody(m.text) : m.text) : null}
                  </div>
                </div>
              ))}
              {isLoading && (
                <div className="msg-row assistant">
                  <div className="avatar">
                    <Spark size={18} spinning />
                  </div>
                  <div className="bubble assistant thinking">
                    <span className="dot" />
                    <span className="dot" />
                    <span className="dot" />
                  </div>
                </div>
              )}
              {error && (
                <div className="error-box">
                  <span className="error-msg">{error}</span>
                  {lastFailed && (
                    <button
                      className="retry-btn"
                      onClick={() => sendMessage(lastFailed)}
                    >
                      Повторить
                    </button>
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="input-area">
          <input
            type="file"
            ref={fileInputRef}
            accept="image/*,video/*,.pdf,.doc,.docx,.txt"
            style={{ display: "none" }}
            onChange={handleFileSelected}
          />

          {pendingAttachment && (
            <div className="attach-preview">
              {pendingAttachment.type === "image" && (
                <img className="attach-preview-media" src={pendingAttachment.dataUrl} alt="" />
              )}
              {pendingAttachment.type === "video" && (
                <video className="attach-preview-media" src={pendingAttachment.dataUrl} muted />
              )}
              {pendingAttachment.type === "file" && (
                <div className="attach-file-chip">
                  <FileIcon size={16} />
                  <span>{pendingAttachment.name}</span>
                </div>
              )}
              <button
                className="attach-remove"
                onClick={() => setPendingAttachment(null)}
                aria-label="Убрать вложение"
              >
                <XIcon size={13} />
              </button>
            </div>
          )}
          {attachError && <div className="attach-error">{attachError}</div>}

          <div className="input-pill">
            <button
              className="icon-btn small"
              aria-label="Добавить"
              disabled={attachBusy}
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
            >
              <Plus size={20} />
            </button>
            <textarea
              ref={textareaRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Спросить Synra"
              rows={1}
            />
            {input.trim() || pendingAttachment ? (
              <button
                className="send-btn active"
                onClick={() => sendMessage(input)}
                aria-label="Отправить"
              >
                <Send size={18} />
              </button>
            ) : (
              <React.Fragment>
                <button
                  className="live-btn"
                  aria-label="Голосовой режим"
                  title="Общение с Synra голосом"
                  onClick={() => setVoiceOpen(true)}
                >
                  <AudioLines size={18} />
                </button>
              </React.Fragment>
            )}
          </div>
          <div className="disclaimer">
            Synra может ошибаться. Проверяйте важную информацию.
          </div>
        </div>
      </main>

      {panelStack.length > 0 && (
        <div className="panel-overlay" onClick={closePanel}>
          <div
            className="panel-sheet"
            role="dialog"
            aria-modal="true"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="panel-header">
              {panelStack.length > 1 ? (
                <button className="icon-btn" onClick={popPanel} aria-label="Назад">
                  <ChevronLeft size={20} />
                </button>
              ) : (
                <div style={{ width: 40 }} />
              )}
              <div className="panel-title">{panelTitle(currentPanel, pendingModel)}</div>
              <button className="icon-btn" onClick={closePanel} aria-label="Закрыть">
                <XIcon size={20} />
              </button>
            </div>

            <div className="panel-body">
              {currentPanel === "menu" && (
                <React.Fragment>
                  <button className="panel-row" onClick={() => pushPanel("settings")}>
                    <SettingsIcon size={18} />
                    <span>Настройки</span>
                    <ChevronRight size={16} className="row-chevron" />
                  </button>
                  <button className="panel-row" onClick={() => pushPanel("help")}>
                    <HelpCircle size={18} />
                    <span>Справка</span>
                    <ChevronRight size={16} className="row-chevron" />
                  </button>
                </React.Fragment>
              )}

              {currentPanel === "settings" && (
                <React.Fragment>
                  <div className="settings-section">
                    <div className="settings-label">Тема</div>
                    <div className="theme-toggle">
                      <button
                        className={`theme-btn ${theme === "light" ? "active" : ""}`}
                        onClick={() => setTheme("light")}
                      >
                        <Sun size={16} />
                        <span>Светлая</span>
                      </button>
                      <button
                        className={`theme-btn ${theme === "dark" ? "active" : ""}`}
                        onClick={() => setTheme("dark")}
                      >
                        <Moon size={16} />
                        <span>Тёмная</span>
                      </button>
                    </div>
                  </div>

                  <div className="settings-section">
                    <div className="settings-label">Голос</div>

                    <div className="settings-row-label">Язык распознавания и озвучивания</div>
                    <div className="theme-toggle">
                      {Object.keys(VOICE_LANGS).map((code) => (
                        <button
                          key={code}
                          className={`theme-btn ${voiceLang === code ? "active" : ""}`}
                          onClick={() => setVoiceLang(code)}
                        >
                          <span>{VOICE_LANG_LABELS[code]}</span>
                        </button>
                      ))}
                    </div>

                    <div className="settings-row-label">Голос озвучивания</div>
                    <select
                      className="voice-select"
                      value={voiceVoiceURI}
                      onChange={(e) => setVoiceVoiceURI(e.target.value)}
                    >
                      <option value="">Автоматически (рекомендуется)</option>
                      {availableVoices
                        .filter((v) => v.lang && v.lang.toLowerCase().startsWith(VOICE_LANGS[voiceLang].split("-")[0]))
                        .map((v) => (
                          <option key={v.voiceURI} value={v.voiceURI}>{v.name}</option>
                        ))}
                    </select>

                    <div className="settings-row-label">Скорость речи: {voiceRate.toFixed(2)}×</div>
                    <input
                      type="range"
                      className="voice-slider"
                      min="0.6"
                      max="1.6"
                      step="0.02"
                      value={voiceRate}
                      onChange={(e) => setVoiceRate(parseFloat(e.target.value))}
                    />

                    <div className="settings-row-label">Громкость: {Math.round(voiceVolume * 100)}%</div>
                    <input
                      type="range"
                      className="voice-slider"
                      min="0"
                      max="1"
                      step="0.05"
                      value={voiceVolume}
                      onChange={(e) => setVoiceVolume(parseFloat(e.target.value))}
                    />

                    <button
                      className={`voice-autocontinue-toggle ${voiceAutoContinue ? "on" : ""}`}
                      onClick={() => setVoiceAutoContinue((v) => !v)}
                      role="switch"
                      aria-checked={voiceAutoContinue}
                    >
                      <span>Продолжать разговор автоматически</span>
                      <span className="switch-pill"><span className="switch-knob" /></span>
                    </button>
                  </div>

                  <div className="settings-section">
                    <div className="settings-label">Аккаунт</div>
                    {account ? (
                      <React.Fragment>
                        <div className="account-row">
                          <div className="account-avatar">
                            {account.provider === "Apple" ? (
                              <AppleIcon size={18} />
                            ) : (
                              "G"
                            )}
                          </div>
                          <div>
                            <div className="account-name">
                              Вход через {account.provider}
                            </div>
                            <div className="account-hint">Демонстрационный вход</div>
                          </div>
                        </div>
                        <button className="logout-btn" onClick={() => setAccount(null)}>
                          <LogOut size={18} />
                          <span>Выйти из аккаунта</span>
                        </button>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <button
                          className="auth-btn"
                          onClick={() => setAccount({ provider: "Google" })}
                        >
                          <span className="google-g">G</span>
                          <span>Войти через Google</span>
                        </button>
                        <button
                          className="auth-btn"
                          onClick={() => setAccount({ provider: "Apple" })}
                        >
                          <AppleIcon size={18} />
                          <span>Войти через Apple</span>
                        </button>
                      </React.Fragment>
                    )}
                  </div>
                </React.Fragment>
              )}

              {currentPanel === "help" && (
                <button className="panel-row" onClick={() => pushPanel("privacy")}>
                  <HelpCircle size={18} />
                  <span>Конфиденциальность и защита данных</span>
                  <ChevronRight size={16} className="row-chevron" />
                </button>
              )}

              {currentPanel === "privacy" && (
                <div className="privacy-text">
                  {PRIVACY_PARAGRAPHS.map((p, i) => (
                    <p key={i}>{p}</p>
                  ))}
                </div>
              )}

              {currentPanel === "models" && (
                <div className="model-list">
                  {MODELS.map((m) => {
                    const unlocked = !m.locked || unlockedIds.includes(m.id);
                    const active = selectedModel.id === m.id;
                    return (
                      <button
                        key={m.id}
                        className={`model-row ${active ? "active" : ""}`}
                        onClick={() => handleSelectModel(m)}
                      >
                        <Spark size={18} />
                        <span className="model-name">{m.name}</span>
                        {unlocked ? (
                          active && <Check size={18} className="model-check" />
                        ) : (
                          <Lock size={16} className="model-lock" />
                        )}
                      </button>
                    );
                  })}
                </div>
              )}

              {currentPanel === "unlock" && pendingModel && (
                <div className="unlock-gate">
                  <div className="unlock-badge">
                    <Lock size={22} />
                  </div>
                  <div className="unlock-title">{pendingModel.name}</div>
                  <p className="unlock-text">
                    Чтобы получить модель <strong>{pendingModel.name}</strong>, подпишитесь на
                    Telegram-канал (подписка проверяется по-настоящему) и подтвердите подписку на X.
                  </p>

                  <a
                    className="social-card telegram"
                    href="https://t.me/securelinevpnbk"
                    onClick={(e) => {
                      e.preventDefault();
                      openExternal("https://t.me/securelinevpnbk");
                    }}
                  >
                    <span className="social-icon">
                      <TelegramIcon size={20} />
                    </span>
                    <span className="social-text">
                      <span className="social-name">Telegram</span>
                      <span className="social-handle">@securelinevpnbk</span>
                    </span>
                    <ChevronRight size={18} className="social-arrow" />
                  </a>

                  <div className="telegram-verify-box">
                    {telegramVerified ? (
                      <div className="verify-ok">
                        <Check size={16} />
                        <span>Подписка подтверждена{telegramUser && telegramUser.first_name ? ` — ${telegramUser.first_name}` : ""}</span>
                      </div>
                    ) : TELEGRAM_BOT_USERNAME.indexOf("REPLACE") !== -1 ? (
                      <div className="verify-hint">
                        Бот ещё не настроен — впишите TELEGRAM_BOT_USERNAME в файл (см. ИНСТРУКЦИЯ-TELEGRAM-BOT.txt).
                      </div>
                    ) : (
                      <React.Fragment>
                        <div ref={telegramWidgetRef} className="telegram-widget-slot" />
                        {telegramChecking && <div className="verify-hint">Проверяем подписку…</div>}
                        {telegramError && <div className="verify-error">{telegramError}</div>}
                      </React.Fragment>
                    )}
                  </div>

                  <a
                    className="social-card xapp"
                    href="https://x.com/securelinevpn?s=21"
                    onClick={(e) => {
                      e.preventDefault();
                      openExternal("https://x.com/securelinevpn?s=21");
                    }}
                  >
                    <span className="social-icon">
                      <BrandXIcon size={16} />
                    </span>
                    <span className="social-text">
                      <span className="social-name">X (Twitter)</span>
                      <span className="social-handle">@securelinevpn</span>
                    </span>
                    <ChevronRight size={18} className="social-arrow" />
                  </a>

                  <label className="x-confirm-row">
                    <input
                      type="checkbox"
                      checked={xConfirmed}
                      onChange={(e) => setXConfirmed(e.target.checked)}
                    />
                    <span>Я подписался на X (без автоматической проверки — честное слово)</span>
                  </label>

                  <button
                    className="unlock-confirm"
                    disabled={!telegramVerified || !xConfirmed}
                    onClick={handleConfirmUnlock}
                  >
                    {telegramVerified && xConfirmed ? "Разблокировать" : "Выполните оба условия выше"}
                  </button>
                </div>
              )}

              {currentPanel === "library" && (
                <div className="library-wrap">
                  {library.length === 0 ? (
                    <div className="library-empty">
                      Здесь будут появляться фото, которые вы отправляете в чат, и изображения,
                      которые сгенерирует Synra (генерация изображений пока не подключена).
                    </div>
                  ) : (
                    <div className="library-grid">
                      {library.map((item) => (
                        <button
                          key={item.id}
                          className="library-thumb"
                          onClick={() => setLibraryPreview(item)}
                        >
                          <img src={item.dataUrl} alt="" />
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {voiceOpen && (
        <div className="voice-overlay">
          <button
            className="voice-top-close"
            onClick={() => setVoiceOpen(false)}
            aria-label="Закрыть голосовой режим"
          >
            <XIcon size={20} />
          </button>

          <div className="voice-center">
            <div className={`voice-blob ${voiceListening ? "listening" : ""} ${voiceSpeakingRef.current ? "speaking" : ""}`} aria-hidden="true" />
            <div className="voice-status">{voiceStatus}</div>
            <div className="voice-hint">Говорите с Synra голосом — она ответит вслух</div>
          </div>

          <div className="voice-controls">
            <button
              className={`voice-icon-btn ${voiceListening ? "active" : ""}`}
              onClick={() => {
                if (voiceSpeakingRef.current) {
                  // Перебиваем Synra на полуслове и сразу слушаем — как в живом разговоре.
                  if (typeof window !== "undefined" && "speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                  }
                  voiceSpeakingRef.current = false;
                  startVoiceRecognition();
                } else if (voiceListening) {
                  stopVoiceRecognition();
                } else {
                  startVoiceRecognition();
                }
              }}
              aria-label={voiceListening ? "Остановить микрофон" : "Включить микрофон"}
            >
              <Mic size={20} />
            </button>
            {voiceSpeakingRef.current && (
              <button
                className="voice-icon-btn"
                onClick={() => {
                  if (typeof window !== "undefined" && "speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                  }
                  voiceSpeakingRef.current = false;
                  setVoiceStatus("Нажмите на микрофон и говорите");
                }}
                aria-label="Остановить озвучивание"
                title="Остановить озвучивание"
              >
                <StopIcon size={18} />
              </button>
            )}
            <button
              className="voice-icon-btn"
              onClick={() => setVoiceOpen(false)}
              aria-label="Закрыть"
            >
              <XIcon size={18} />
            </button>
          </div>
        </div>
      )}

      {messageMenu && (
        <div
          className="msg-menu-overlay"
          onClick={() => setMessageMenu(null)}
          onContextMenu={(e) => {
            e.preventDefault();
            setMessageMenu(null);
          }}
        >
          <div
            className="msg-menu"
            style={{
              left: Math.max(20, Math.min(messageMenu.x, window.innerWidth - 240)),
              top: Math.max(20, Math.min(messageMenu.y, window.innerHeight - 180)),
            }}
            onClick={(e) => e.stopPropagation()}
          >
            <button className="msg-menu-item" onClick={() => handleCopyMessage(messageMenu.text)}>
              <CopyIcon size={16} />
              <span>Скопировать</span>
            </button>
            {messageMenu.role === "user" && (
              <button className="msg-menu-item" onClick={() => handleEditMessage(messageMenu)}>
                <EditIcon size={16} />
                <span>Изменить</span>
              </button>
            )}
            <button
              className="msg-menu-item danger"
              onClick={() => handleDeleteMessage(messageMenu)}
            >
              <TrashIcon size={16} />
              <span>Удалить</span>
            </button>
          </div>
        </div>
      )}

      {libraryPreview && (
        <div className="lightbox-overlay" onClick={() => setLibraryPreview(null)}>
          <button
            className="lightbox-close"
            onClick={() => setLibraryPreview(null)}
            aria-label="Закрыть"
          >
            <XIcon size={20} />
          </button>
          <img className="lightbox-image" src={libraryPreview.dataUrl} alt="" />
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
