/* ---------- lightweight markdown-style rendering for assistant replies ---------- */

function formatInline(text, keyPrefix) {
  const parts = text
    .split(/(\*\*[^*]+\*\*|`[^`]+`|https?:\/\/[^\s<>()\[\]"']+)/g)
    .filter((p) => p !== "");
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={`${keyPrefix}-b-${i}`}>{part.slice(2, -2)}</strong>;
    }
    if (part.startsWith("`") && part.endsWith("`")) {
      return (
        <code key={`${keyPrefix}-c-${i}`} className="inline-code">
          {part.slice(1, -1)}
        </code>
      );
    }
    if (/^https?:\/\//.test(part)) {
      const trailingMatch = part.match(/[.,!?;:]+$/);
      const trailing = trailingMatch ? trailingMatch[0] : "";
      const url = trailing ? part.slice(0, -trailing.length) : part;
      return (
        <React.Fragment key={`${keyPrefix}-a-${i}`}>
          <a href={url} target="_blank" rel="noopener noreferrer" className="msg-link">
            {url}
          </a>
          {trailing}
        </React.Fragment>
      );
    }
    return <span key={`${keyPrefix}-t-${i}`}>{part}</span>;
  });
}

function renderMessageBody(text) {
  const blocks = [];
  const codeRegex = /```([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  let blockIndex = 0;

  const pushTextBlock = (chunk, keyBase) => {
    const lines = chunk.split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
          i++;
        }
        blocks.push(
          <ul className="msg-list" key={`${keyBase}-ul-${i}`}>
            {items.map((it, idx) => (
              <li key={idx}>{formatInline(it, `${keyBase}-ul-${i}-${idx}`)}</li>
            ))}
          </ul>
        );
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
          i++;
        }
        blocks.push(
          <ol className="msg-list" key={`${keyBase}-ol-${i}`}>
            {items.map((it, idx) => (
              <li key={idx}>{formatInline(it, `${keyBase}-ol-${i}-${idx}`)}</li>
            ))}
          </ol>
        );
        continue;
      }
      if (line.trim() === "") {
        i++;
        continue;
      }
      const paraLines = [line];
      i++;
      while (
        i < lines.length &&
        lines[i].trim() !== "" &&
        !/^\s*[-*]\s+/.test(lines[i]) &&
        !/^\s*\d+\.\s+/.test(lines[i])
      ) {
        paraLines.push(lines[i]);
        i++;
      }
      blocks.push(
        <p className="msg-para" key={`${keyBase}-p-${i}`}>
          {paraLines.map((pl, idx) => (
            <span key={idx}>
              {formatInline(pl, `${keyBase}-p-${i}-${idx}`)}
              {idx < paraLines.length - 1 && <br />}
            </span>
          ))}
        </p>
      );
    }
  };

  while ((match = codeRegex.exec(text)) !== null) {
    const before = text.slice(lastIndex, match.index);
    if (before) pushTextBlock(before, `b${blockIndex++}`);
    const langMatch = match[1].match(/^([a-zA-Z]*)\n([\s\S]*)$/);
    const lang = langMatch ? langMatch[1] : "";
    const codeContent = langMatch ? langMatch[2] : match[1];
    const isMath = lang === "math";
    blocks.push(
      <pre className={isMath ? "msg-code msg-math" : "msg-code"} key={`code-${blockIndex++}`}>
        <code>{codeContent}</code>
      </pre>
    );
    lastIndex = codeRegex.lastIndex;
  }
  const rest = text.slice(lastIndex);
  if (rest) pushTextBlock(rest, `b${blockIndex++}`);

  return blocks;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("read failed"));
    reader.readAsDataURL(file);
  });
}

function getVideoDuration(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const videoEl = document.createElement("video");
    videoEl.preload = "metadata";
    videoEl.onloadedmetadata = () => {
      URL.revokeObjectURL(url);
      resolve(videoEl.duration);
    };
    videoEl.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("video load error"));
    };
    videoEl.src = url;
  });
}

function resizeImageToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      if (width > maxDim || height > maxDim) {
        if (width >= height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("image load error"));
    };
    img.src = url;
  });
}

// Поиск изображений через открытый публичный API Openverse — работает
// напрямую из браузера, без своего сервера и без API-ключа.
async function performImageSearch(query) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);
  const params = new URLSearchParams({
    action: "query",
    generator: "search",
    gsrnamespace: "6",
    gsrsearch: query,
    gsrlimit: "16",
    prop: "imageinfo",
    iiprop: "url",
    iiurlwidth: "320",
    format: "json",
    origin: "*",
  });
  let response;
  try {
    response = await fetch(
      "https://commons.wikimedia.org/w/api.php?" + params.toString(),
      { signal: controller.signal }
    );
  } catch (err) {
    clearTimeout(timeoutId);
    const e = new Error("image_search_failed");
    e.code = err && err.name === "AbortError" ? "timeout" : "network";
    throw e;
  }
  clearTimeout(timeoutId);
  if (!response.ok) {
    const e = new Error("image_search_http_error");
    e.code = "http";
    e.status = response.status;
    throw e;
  }
  let data;
  try {
    data = await response.json();
  } catch (err) {
    const e = new Error("image_search_parse_error");
    e.code = "parse";
    throw e;
  }
  if (data && data.error) {
    const e = new Error("image_search_api_error");
    e.code = "http";
    e.status = 400;
    throw e;
  }
  const pagesObj = (data && data.query && data.query.pages) || {};
  const pages = Object.keys(pagesObj)
    .map((k) => pagesObj[k])
    .sort((a, b) => (a.index || 0) - (b.index || 0));
  const images = pages
    .map((p) => {
      const ii = p && p.imageinfo && p.imageinfo[0];
      if (!ii) return null;
      return {
        thumbnail: ii.thumburl || ii.url || "",
        source: ii.descriptionurl || ii.url || "",
        title: (p.title || "").replace(/^File:/, ""),
        creator: "",
      };
    })
    .filter((im) => im && im.thumbnail && im.source)
    .slice(0, 12);
  if (!images.length) {
    const e = new Error("image_search_empty");
    e.code = "empty";
    throw e;
  }
  return { text: "Нашёл картинки по запросу «" + query + "»:", images };
}

function imageSearchErrorText(err) {
  const code = err && err.code;
  if (code === "network") {
    return "Похоже, нет подключения к интернету. Проверьте соединение и попробуйте снова.";
  }
  if (code === "timeout") {
    return "Поиск картинок занял слишком много времени и был прерван. Попробуйте ещё раз.";
  }
  if (code === "empty") {
    return "По этому запросу ничего не нашлось 🔍 Попробуйте изменить запрос.";
  }
  if (code === "parse") {
    return "Сервис поиска картинок вернул непонятный ответ. Попробуйте повторить поиск.";
  }
  if (code === "http") {
    const s = err.status;
    if (s === 400) return "Некорректный запрос для поиска картинок. Попробуйте переформулировать.";
    if (s === 401 || s === 403) return "Доступ к поиску картинок временно ограничен. Попробуйте позже.";
    if (s === 404) return "Сервис поиска картинок сейчас недоступен (404). Попробуйте позже.";
    if (s === 429) return "Сервис поиска картинок перегружен запросами. Подождите немного и повторите поиск.";
    if (s >= 500) return "Сервис поиска картинок временно недоступен. Попробуйте повторить поиск позже.";
    return "Не удалось выполнить поиск картинок (код " + s + "). Попробуйте повторить.";
  }
  return "Не удалось выполнить поиск картинок. Попробуйте ещё раз позже.";
}

      voices.find((v) => rePrefixOnly.test(v.lang)) ||

      null
    );
  }, []);

  const speakVoiceReply = useCallback((text) => {
    if (!text || typeof window === "undefined" || !("speechSynthesis" in window)) return;

    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(
        String(text).replace(/[*_`#>]/g, "").replace(/\n+/g, " ").trim()
      );

      const voices = window.speechSynthesis.getVoices();
      let preferred = null;
      if (voiceVoiceURIRef.current) {
        preferred = voices.find((v) => v.voiceURI === voiceVoiceURIRef.current) || null;
      }
      if (!preferred) preferred = voiceBestVoiceRef.current;
      if (!preferred) {
        preferred = pickBestVoiceForLang(voiceLangRef.current);
        if (preferred) voiceBestVoiceRef.current = preferred;
      }
      if (preferred) utterance.voice = preferred;
      utterance.lang = VOICE_LANGS[voiceLangRef.current] || "ru-RU";

      // Нейтральный/андрогинный тембр: средняя высота + пользовательский темп/громкость.
      utterance.pitch = voicePitchRef.current;
      utterance.rate = voiceRateRef.current;
      utterance.volume = voiceVolumeRef.current;

      voiceSpeakingRef.current = true;
      setVoiceStatus("Synra отвечает…");
      utterance.onend = () => {
        voiceSpeakingRef.current = false;
        if (voiceOpenRef.current && !voiceManuallyStoppedRef.current && voiceAutoContinueRef.current) {
          setVoiceStatus("Слушаю…");
          voiceGotResultRef.current = false;
          setVoiceListening(true);
          try { voiceRecognitionRef.current && voiceRecognitionRef.current.start(); } catch (_) {}
        } else {
          setVoiceStatus("Нажмите на микрофон и говорите");
        }
      };
      utterance.onerror = () => {
        voiceSpeakingRef.current = false;
        setVoiceStatus("Нажмите на микрофон и говорите");
      };
      window.speechSynthesis.speak(utterance);
    } catch (err) {
      console.error("Synra: ошибка синтеза речи", err);
    }
  }, [voiceOpen, pickBestVoiceForLang]);

  const sendMessage = useCallback(
    async (rawText, attachmentArg) => {
      const text = (rawText || "").trim();
      const attachment = attachmentArg !== undefined ? attachmentArg : pendingAttachment;
      if ((!text && !attachment) || isLoading) return;

      const chatId = activeId;
      const userMsg = { role: "user", text, attachment: attachment || null };

      // Передаём историю текущего чата модели (Claude ничего не помнит
      // между вызовами сам), но ограничиваем её размер, чтобы запрос не
      // рос бесконечно.
      const MAX_CONTEXT_MESSAGES = 40;
      const MAX_CONTEXT_CHARS = 60000;
      const rawHistory = [...messages, userMsg];
      let history = rawHistory.slice(-MAX_CONTEXT_MESSAGES);
      let totalChars = 0;
      history = history
        .slice()
        .reverse()
        .filter((m) => {
          const value = typeof m.text === "string" ? m.text : "";
          const size = value.length;
          if (totalChars + size > MAX_CONTEXT_CHARS && totalChars > 0) return false;
          totalChars += size;
          return true;
        })
        .reverse();

      const historyForApi = history.map((m) => {
        const baseText = typeof m.text === "string" ? m.text : "";

        // Текущий выбранный yandexgpt — текстовая модель. Не отправляем
        // старый Anthropic-формат изображений, который был нужен Worker.
        // Само вложение при этом продолжает сохраняться и отображаться в UI.
        if (m.attachment && m.attachment.type === "image") {
          const prefix = baseText ? `${baseText}\n\n` : "";
          return {
            role: m.role,
            content: `${prefix}[Пользователь прикрепил изображение: ${m.attachment.name || "изображение"}. Текущая модель Synra подключена в текстовом режиме и не анализирует это изображение.]`,
          };
        }

        if (m.attachment && m.attachment.type === "file") {
          const prefix = baseText ? `${baseText}\n\n` : "";
          return {
            role: m.role,
            content: `${prefix}[Пользователь прикрепил файл: ${m.attachment.name || "файл"}. Содержимое файла не передаётся модели в этой версии.]`,
          };
        }

        if (m.attachment && m.attachment.type === "video") {
          const prefix = baseText ? `${baseText}\n\n` : "";
          return {
            role: m.role,
            content: `${prefix}[Пользователь прикрепил видео: ${m.attachment.name || "видео"}. Содержимое видео не передаётся модели в этой версии.]`,
          };
        }

        return { role: m.role, content: baseText };
      });

      updateChat(chatId, (c) => ({
        ...c,
        title: c.messages.length === 0 ? (text || "Вложение").slice(0, 32) : c.title,
        messages: [...c.messages, userMsg],
      }));

      if (attachment && attachment.type === "image") {
        setLibrary((prev) =>
          [
            {
              id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
              dataUrl: attachment.dataUrl,
              name: attachment.name,
              source: "user",
              ts: Date.now(),
            },
            ...prev,
          ].slice(0, 60)
        );
      }

      setInput("");
      setPendingAttachment(null);
      setAttachError(null);
      setError(null);
      setLastFailed(null);
      setIsLoading(true);
      setStreamingText("");
      streamingChatIdRef.current = chatId;

      let streamedText = "";

      try {
        let imgQuery = null;
        try {
          imgQuery = window.SynraBrain.detectImageSearch ? window.SynraBrain.detectImageSearch(text) : null;
        } catch (_) {
          imgQuery = null;
        }
        if (imgQuery) {
          const cooldownMs = 3000;
          const waitMs = cooldownMs - (Date.now() - imageSearchLastRef.current);
          if (waitMs > 0) {
            let remain = Math.ceil(waitMs / 1000);
            setStreamingText("⏳ Подождите " + remain + " сек. перед следующим поиском изображений…");
            await new Promise((resolve) => {
              const iv = setInterval(() => {
                remain -= 1;
                if (remain > 0) {
                  setStreamingText("⏳ Подождите " + remain + " сек. перед следующим поиском изображений…");
                } else {
                  clearInterval(iv);
                  resolve();
                }
              }, 1000);
            });
          }
          imageSearchLastRef.current = Date.now();
          setStreamingText("🔎 Ищу картинки по запросу «" + imgQuery + "»…");
          try {
            const found = await performImageSearch(imgQuery);
            updateChat(chatId, (c) => ({
              ...c,
              messages: [...c.messages, { role: "assistant", text: found.text, gallery: found.images }],
            }));
          } catch (imgErr) {
            console.error("Synra: image search error —", imgErr);
            updateChat(chatId, (c) => ({
              ...c,
              messages: [...c.messages, { role: "assistant", text: imageSearchErrorText(imgErr) }],
            }));
          }
          return;
        }
        const recentHistory = historyForApi.slice(0, -1).slice(-16);
        const full = window.SynraBrain.reply(text, recentHistory);
        await new Promise((r) => setTimeout(r, 300 + Math.random() * 400));
        for (let i = 3; i < full.length; i += 3) {
          streamedText = full.slice(0, i);
          setStreamingText(streamedText);
          await new Promise((r) => setTimeout(r, 16));
        }
        const cleanReplyText = full;
        updateChat(chatId, (c) => ({
          ...c,
          messages: [...c.messages, { role: "assistant", text: cleanReplyText }],
        }));
        if (voiceOpen) {
          speakVoiceReply(cleanReplyText);
        }
      } catch (err) {
        console.error("Synra: ошибка запроса к ИИ —", err);
        setLastFailed(text);

        // Если часть ответа уже успела прийти до сбоя — сохраняем её как
        // обычное сообщение, а не теряем целиком.
        if (streamedText && streamedText.trim() && err && err.code !== "refused") {
          updateChat(chatId, (c) => ({
            ...c,
            messages: [...c.messages, { role: "assistant", text: streamedText.trim() }],
          }));
        }

        const code = err && err.code;
        let friendly = "Не удалось получить ответ от Synra. Попробуйте ещё раз.";
        if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
          friendly = "ИИ-ответы Synra доступны только внутри Claude (в предпросмотре или на claude.ai). Откройте эту страницу через Claude, чтобы чат заработал.";
        } else if (code === "not_granted") {
          friendly = "Вы не разрешили Synra обращаться к Claude в этом окне. Разрешите доступ и отправьте сообщение ещё раз.";
        } else if (code === "sampling_disabled") {
          friendly = "Обращения к Claude отключены для этого аккаунта/организации.";
        } else if (code === "session_expired") {
          friendly = "Сессия истекла — войдите заново и повторите отправку.";
        } else if (code === "rate_limited") {
          friendly = "Слишком много запросов подряд. Подождите немного и попробуйте снова.";
        } else if (code === "refused") {
          friendly = "Synra отказалась отвечать на этот запрос. Попробуйте переформулировать сообщение.";
        } else if (code === "empty_completion") {
          friendly = "Synra не смогла сформировать ответ. Сформулируйте вопрос короче или иначе.";
        } else if (code === "prompt_too_large") {
          friendly = "Слишком длинная переписка для одного запроса. Начните новый чат или сократите сообщение.";
        } else if (code === "cancelled") {
          friendly = null;
        } else if (code === "upstream_error") {
          friendly = "Временная ошибка на стороне Claude. Попробуйте ещё раз через немного времени.";
        }

        if (friendly) setError(friendly);
      } finally {
        setIsLoading(false);
        setStreamingText("");
        streamingChatIdRef.current = null;
      }
    },
    [activeId, messages, isLoading, pendingAttachment, voiceOpen, speakVoiceReply]
  );

  useEffect(() => {
    sendMessageRef.current = sendMessage;
  }, [sendMessage]);

  useEffect(() => {
    voiceOpenRef.current = voiceOpen;
  }, [voiceOpen]);

  useEffect(() => {
    if (typeof window === "undefined" || !("speechSynthesis" in window)) return;
    const refreshVoices = () => {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return;
      setAvailableVoices(voices);
      const best = pickBestVoiceForLang(voiceLangRef.current);
      if (best) voiceBestVoiceRef.current = best;
    };
    refreshVoices();
    window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
    return () => window.speechSynthesis.removeEventListener("voiceschanged", refreshVoices);
  }, [pickBestVoiceForLang]);

  useEffect(() => {
    voiceLangRef.current = voiceLang;
    if (voiceRecognitionRef.current) {
      try { voiceRecognitionRef.current.lang = VOICE_LANGS[voiceLang] || "ru-RU"; } catch (_) {}
    }
    const best = pickBestVoiceForLang(voiceLang);
    if (best) voiceBestVoiceRef.current = best;
  }, [voiceLang, pickBestVoiceForLang]);

  useEffect(() => { voiceRateRef.current = voiceRate; }, [voiceRate]);
  useEffect(() => { voiceVolumeRef.current = voiceVolume; }, [voiceVolume]);
  useEffect(() => { voiceAutoContinueRef.current = voiceAutoContinue; }, [voiceAutoContinue]);
  useEffect(() => { voiceVoiceURIRef.current = voiceVoiceURI; }, [voiceVoiceURI]);

  const clearLongPressTimer = () => {
    if (longPressTimer.current) {
      clearTimeout(longPressTimer.current);
      longPressTimer.current = null;
    }
  };

  const openMessageMenu = (point, chatId, msgIndex, role, text) => {
    setMessageMenu({ chatId, msgIndex, role, text, x: point.clientX, y: point.clientY });
  };

  const handleMsgPointerDown = (e, chatId, msgIndex, role, text) => {
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    pressStartPos.current = { x: point.clientX, y: point.clientY };
    clearLongPressTimer();
    longPressTimer.current = setTimeout(() => {
      openMessageMenu(point, chatId, msgIndex, role, text);
    }, 500);
  };

  const handleMsgPointerMove = (e) => {
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    const dx = Math.abs(point.clientX - pressStartPos.current.x);
    const dy = Math.abs(point.clientY - pressStartPos.current.y);
    if (dx > 10 || dy > 10) clearLongPressTimer();
  };

  const handleMsgPointerUp = () => {
    clearLongPressTimer();
  };

  const handleMsgContextMenu = (e, chatId, msgIndex, role, text) => {
    e.preventDefault();
    clearLongPressTimer();
    openMessageMenu(e, chatId, msgIndex, role, text);
  };

  const handleCopyMessage = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (err2) {
        console.error("Synra: copy failed", err2);
      }
    }
    setMessageMenu(null);
  };

  const handleQuickCopy = async (text, key) => {
    await handleCopyMessage(text);
    setCopiedKey(key);
    setTimeout(() => setCopiedKey((k) => (k === key ? null : k)), 1500);
  };

  const handleEditMessage = (menu) => {
    updateChat(menu.chatId, (c) => ({
      ...c,
      messages: c.messages.slice(0, menu.msgIndex),
    }));
    setInput(menu.text);
    setMessageMenu(null);
    setTimeout(() => {
      if (textareaRef.current) textareaRef.current.focus();
    }, 50);
  };

  const handleDeleteMessage = (menu) => {
    updateChat(menu.chatId, (c) => ({
      ...c,
      messages: c.messages.filter((_, idx) => idx !== menu.msgIndex),
    }));
    setMessageMenu(null);
  };

  const handleFileSelected = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    const isImage = file.type.startsWith("image/");
    const isVideo = file.type.startsWith("video/");

    if (file.size > 20 * 1024 * 1024) {
      setAttachError("Файл слишком большой (максимум 20 МБ).");
      return;
    }

    setAttachBusy(true);
    setAttachError(null);

    try {
      if (isVideo) {
        const duration = await getVideoDuration(file);
        if (duration > 10.5) {
          setAttachError("Видео можно прикрепить не длиннее 10 секунд.");
          setAttachBusy(false);
          return;
        }
        const dataUrl = await fileToDataUrl(file);
        setPendingAttachment({ type: "video", dataUrl, name: file.name, mime: file.type });
      } else if (isImage) {
        const dataUrl = await resizeImageToDataUrl(file, 1280, 0.82);
        setPendingAttachment({ type: "image", dataUrl, name: file.name, mime: "image/jpeg" });
      } else {
        const dataUrl = await fileToDataUrl(file);
        setPendingAttachment({ type: "file", dataUrl, name: file.name, mime: file.type, size: file.size });
      }
    } catch (err) {
      setAttachError("Не удалось прочитать файл.");
    } finally {
      setAttachBusy(false);
    }
  };

  const startGSRecording = useCallback(async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      setVoiceStatus("Запись ГС не поддерживается этим браузером");
      return;
    }
    if (isRecordingGS) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      const recorder = new MediaRecorder(stream, { mimeType: mime });
      recordingChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) recordingChunksRef.current.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach((track) => track.stop());
        const blob = new Blob(recordingChunksRef.current, { type: mime });
        const url = URL.createObjectURL(blob);
        updateChat(activeId, (c) => ({
          ...c,
          messages: [...c.messages, { role: "user", text: "", attachment: { type: "audio", url, name: "Голосовое сообщение", mime, size: blob.size } }]
        }));
        setIsRecordingGS(false);
      };
      recorder.onerror = () => {
        stream.getTracks().forEach((track) => track.stop());
        setIsRecordingGS(false);
      };
      mediaRecorderRef.current = recorder;
      recorder.start();
      setIsRecordingGS(true);
    } catch (err) {
      console.error("Synra: ошибка записи ГС", err);
      setIsRecordingGS(false);
    }
  }, [activeId, isRecordingGS, updateChat]);

  const stopGSRecording = useCallback(() => {
    const recorder = mediaRecorderRef.current;
    if (recorder && recorder.state !== "inactive") recorder.stop();
    mediaRecorderRef.current = null;
    setIsRecordingGS(false);
  }, []);

  const startVoiceRecognition = useCallback(() => {
    if (typeof window === "undefined") return;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      setVoiceStatus("Голосовой ввод не поддерживается этим браузером");
      return;
    }
    if (voiceSpeakingRef.current) return;

    if (voiceRestartTimerRef.current) {
      clearTimeout(voiceRestartTimerRef.current);
      voiceRestartTimerRef.current = null;
    }

    if (!voiceRecognitionRef.current) {
      const recognition = new Recognition();
      recognition.lang = VOICE_LANGS[voiceLangRef.current] || "ru-RU";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        voiceGotResultRef.current = false;
        setVoiceListening(true);
        setVoiceStatus("Слушаю…");
      };

      recognition.onresult = (event) => {
        const transcript = event.results && event.results[0] && event.results[0][0] && event.results[0][0].transcript ? String(event.results[0][0].transcript).trim() : "";
        if (!transcript) return;
        voiceGotResultRef.current = true;
        setVoiceListening(false);
        setVoiceStatus("Отправляю…");
        voiceManuallyStoppedRef.current = false;
        if (sendMessageRef.current) sendMessageRef.current(transcript);
      };

      recognition.onerror = (event) => {
        setVoiceListening(false);
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          voiceManuallyStoppedRef.current = true;
          setVoiceStatus("Разрешите доступ к микрофону в браузере");
          return;
        }
        if (event.error === "aborted") return;
        // Пауза/тишина и похожие временные ошибки — не прерываем диалог,
        // а тихо продолжаем слушать, как в настоящем голосовом режиме.
        if (voiceOpenRef.current && !voiceManuallyStoppedRef.current && !voiceSpeakingRef.current) {
          setVoiceStatus("Слушаю…");
          voiceRestartTimerRef.current = setTimeout(() => startVoiceRecognition(), 400);
        } else {
          setVoiceStatus("Нажмите на микрофон и говорите");
        }
      };

      recognition.onend = () => {
        setVoiceListening(false);
        if (
          !voiceGotResultRef.current &&
          voiceOpenRef.current &&
          !voiceManuallyStoppedRef.current &&
          !voiceSpeakingRef.current
        ) {
          // Ничего не расслышали — не заставляем нажимать микрофон заново,
          // просто продолжаем слушать дальше.
          voiceRestartTimerRef.current = setTimeout(() => startVoiceRecognition(), 400);
        }
      };

      voiceRecognitionRef.current = recognition;
    }

    voiceManuallyStoppedRef.current = false;
    try {
      voiceRecognitionRef.current.start();
    } catch (_) {
      setVoiceListening(true);
      setVoiceStatus("Слушаю…");
    }
  }, []);

  const stopVoiceRecognition = useCallback(() => {
    voiceManuallyStoppedRef.current = true;
    if (voiceRestartTimerRef.current) {
      clearTimeout(voiceRestartTimerRef.current);
      voiceRestartTimerRef.current = null;
    }
    setVoiceListening(false);
    if (voiceRecognitionRef.current) {
      try { voiceRecognitionRef.current.stop(); } catch (_) {}
    }
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    voiceSpeakingRef.current = false;
    setVoiceStatus("Нажмите на микрофон и говорите");
  }, []);

  useEffect(() => {
    if (!voiceOpen) {
      stopVoiceRecognition();
      return;
    }
    voiceManuallyStoppedRef.current = false;
    const timer = setTimeout(() => startVoiceRecognition(), 250);
    return () => clearTimeout(timer);
  }, [voiceOpen, startVoiceRecognition, stopVoiceRecognition]);

  useEffect(() => {
    return () => {
      if (voiceRestartTimerRef.current) clearTimeout(voiceRestartTimerRef.current);
      try { voiceRecognitionRef.current && voiceRecognitionRef.current.stop(); } catch (_) {}
      if (typeof window !== "undefined" && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    };
  }, []);

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input);
    }
  };

  const historyChats = chats.filter((c) => c.messages.length > 0);
  const trimmedQuery = searchQuery.trim().toLowerCase();
  const visibleChats = trimmedQuery
    ? historyChats.filter((c) => {
        if (c.title.toLowerCase().includes(trimmedQuery)) return true;
        return c.messages.some((m) => m.text.toLowerCase().includes(trimmedQuery));
      })
    : historyChats;

  useEffect(() => {
    savePersisted({
      chats,
      activeId,
      selectedModelId: selectedModel.id,
      unlockedIds,
      theme,
      library,
      voiceLang,
      voiceRate,
      voiceVolume,
      voiceAutoContinue,
      voiceVoiceURI,
    });
  }, [
    chats,
    activeId,
    selectedModel,
    unlockedIds,
    theme,
    library,
    voiceLang,
    voiceRate,
    voiceVolume,
    voiceAutoContinue,
    voiceVoiceURI,
  ]);

  return (
    <div className={`shell ${theme === "dark" ? "dark" : ""}`}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap');

        *{ box-sizing:border-box; }
        html, body{
          margin:0; padding:0;
          height:100%; height:100dvh; height:var(--app-height, 100dvh);
          overflow:hidden; overscroll-behavior:none;
          -webkit-text-size-adjust:100%; text-size-adjust:100%;
          background:#a9d3f7;
          touch-action:pan-x pan-y;
        }
        #root{ height:100%; height:100dvh; height:var(--app-height, 100dvh); }
        .shell{
          --bg0:#ffffff; --bg1:#eaf3fd; --bg2:#cfe6fb; --bg3:#a9d3f7;
          --text:#1F1F1F; --text-secondary:#5F6368;
          --sidebar-bg:#F8F9FB; --border:#E3E6EA;
          --surface:#ffffff; --hover:#EDEEF1;
          --bubble-user:#EDF2FB; --active-bg:#E3E9FD; --active-text:#1a56db;
          --placeholder:#80868B; --icon:#444;
          --avatar-bg:#F0F4F9; --code-inline-bg:#EDEEF1;
          --live-bg:#DCEEFB; --live-bg-hover:#C9E4F9;
          --panel-overlay:rgba(0,0,0,.32);

          position:fixed; top:var(--app-offset-top, 0px); right:0; bottom:0; left:0;
          height:100%; height:100dvh; height:var(--app-height, 100dvh); width:100%;
          display:flex; overscroll-behavior:none;
          font-family:'Sora', system-ui, -apple-system, sans-serif;
          background:linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 40%, var(--bg2) 70%, var(--bg3) 100%);
          color:var(--text); overflow:hidden;
          transition:background .3s ease, color .3s ease;
        }
        .topbar-title, .bubble.user, .panel-sheet, .msg-menu{
          transition:background-color .3s ease, border-color .3s ease, color .3s ease;
        }
        .shell.dark{
          --bg0:#0B0D12; --bg1:#12151C; --bg2:#151A24; --bg3:#182233;
          --text:#E8EAED; --text-secondary:#9AA0A6;
          --sidebar-bg:#111319; --border:#2A2E37;
          --surface:#1B1F27; --hover:#262B34;
          --bubble-user:#232A38; --active-bg:#1E2A45; --active-text:#8AB4F8;
          --placeholder:#7C818A; --icon:#C4C7CC;
          --avatar-bg:#1B2330; --code-inline-bg:#2A2E37;
          --live-bg:#1E2A3D; --live-bg-hover:#243349;
          --panel-overlay:rgba(0,0,0,.6);
        }

        /* Sidebar */
        .sidebar{
          width:280px; flex-shrink:0; background:var(--sidebar-bg);
          border-right:1px solid var(--border); display:flex; flex-direction:column;
          padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
          transition:width .2s ease, padding .2s ease, transform .25s ease, background-color .3s ease, border-color .3s ease;
        }
        .sidebar.closed{ width:0; padding:12px 0; overflow:hidden; border-right:none; }
        .new-chat-btn{
          display:flex; align-items:center; gap:10px; background:var(--surface);
          border:1px solid var(--border); border-radius:20px; padding:10px 16px;
          font-size:14px; font-weight:500; color:var(--text); cursor:pointer;
          white-space:nowrap; transition:background .15s, box-shadow .15s;
        }
        .new-chat-btn:hover{ background:var(--hover); box-shadow:0 1px 2px rgba(0,0,0,.08); }
        .history{ margin-top:20px; overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
        .history-label{ font-size:12px; color:var(--text-secondary); padding:8px 12px 4px; font-weight:500; }
        .history-item{
          display:flex; align-items:center; gap:10px; width:100%; text-align:left;
          padding:9px 8px 9px 12px; border:none; background:transparent; border-radius:16px;
          font-size:14px; color:var(--text); cursor:pointer; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis; transition:background .15s ease;
        }
        .history-item:hover{ background:var(--hover); }
        .history-item.active{ background:var(--active-bg); color:var(--active-text); }
        .history-item-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
        .history-delete-btn{
          width:28px; height:28px; flex:0 0 28px; border:none; border-radius:9px;
          background:transparent; color:var(--muted); display:flex; align-items:center;
          justify-content:center; cursor:pointer; opacity:0; transition:opacity .15s, background .15s, color .15s;
        }
        .history-item:hover .history-delete-btn,
        .history-item:focus-within .history-delete-btn{ opacity:1; }
        .history-delete-btn:hover{ background:rgba(220,60,70,.12); color:#d13c48; }
        .sidebar-bottom-item{
          display:flex; align-items:center; gap:12px; padding:12px; margin-top:auto;
          border:none; border-top:1px solid var(--border); background:transparent;
          border-radius:0; font-size:14px; color:var(--icon); cursor:pointer; white-space:nowrap;
          transition:background .15s ease;
        }
        .sidebar-bottom-item:hover{ background:var(--hover); }
        .sidebar-search-btn{
          display:flex; align-items:center; gap:10px; width:100%; margin-top:6px;
          padding:9px 12px; border:none; background:transparent; border-radius:16px;
          font-size:14px; color:var(--text); cursor:pointer; text-align:left; font-family:inherit;
          transition:background .15s ease;
        }
        .sidebar-search-btn:hover{ background:var(--hover); }
        .sidebar-search-box{
          display:flex; align-items:center; gap:8px; margin:8px 0 4px; padding:8px 12px;
          background:var(--surface); border:1px solid var(--border); border-radius:14px;
        }
        .sidebar-search-box input{
          flex:1; min-width:0; border:none; outline:none; background:transparent;
          font-size:13.5px; color:var(--text); font-family:inherit;
        }
        .sidebar-search-box input::placeholder{ color:var(--placeholder); }
        .search-box-icon{ color:var(--text-secondary); flex-shrink:0; }
        .search-clear-btn{ border:none; background:transparent; color:var(--text-secondary); cursor:pointer; display:flex; flex-shrink:0; padding:0; }
        .search-empty{ font-size:13px; color:var(--text-secondary); text-align:center; padding:16px 8px; }

        .backdrop{ display:none; }

        /* Main */
        .main{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
        .topbar{ position:relative; display:flex; align-items:center; justify-content:space-between; padding:max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); flex-shrink:0; }
        .topbar-title{ position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px; font-size:16px; font-weight:500; padding:6px 10px; border-radius:20px; color:var(--text); border:none; background:transparent; cursor:pointer; }
        .topbar-title:hover{ background:var(--hover); }
        .chevron{ color:var(--text-secondary); }

        .model-list{ display:flex; flex-direction:column; gap:4px; padding:4px; }
        .model-row{
          display:flex; align-items:center; gap:12px; width:100%; padding:13px 12px; border:none;
          background:transparent; border-radius:14px; cursor:pointer; text-align:left; font-family:inherit;
        }
        .model-row:hover{ background:var(--hover); }
        .model-row.active{ background:var(--active-bg); }
        .model-name{ font-size:14.5px; color:var(--text); flex:1; }
        .model-check{ color:#2E5EEA; flex-shrink:0; }
        .model-lock{ color:var(--text-secondary); flex-shrink:0; }

        .unlock-gate{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px 10px 6px; }
        .unlock-badge{
          width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
          background:linear-gradient(135deg,#2E5EEA,#4FC1E0,#6BE7B0); color:#fff; margin-bottom:14px;
          box-shadow:0 8px 20px rgba(46,94,234,.35);
        }
        .unlock-title{ font-size:18px; font-weight:700; color:var(--text); margin-bottom:6px; }
        .unlock-text{ font-size:14px; color:var(--text-secondary); line-height:1.6; margin:0 0 20px; max-width:320px; }
        .unlock-text strong{ color:var(--text); }
        .social-card{
          display:flex; align-items:center; gap:12px; width:100%; max-width:360px;
          padding:12px 14px; border-radius:16px; border:1px solid var(--border); background:var(--surface);
          text-decoration:none; color:var(--text); margin-bottom:10px; transition:transform .15s, box-shadow .15s;
        }
        .social-card:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.1); }
        .social-icon{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .social-card.telegram .social-icon{ background:linear-gradient(135deg,#37AEE2,#1E96C8); color:#fff; }
        .social-card.xapp .social-icon{ background:#000; color:#fff; }
        .social-text{ display:flex; flex-direction:column; text-align:left; flex:1; min-width:0; }
        .social-name{ font-size:14px; font-weight:600; }
        .social-handle{ font-size:12.5px; color:var(--text-secondary); }
        .social-arrow{ color:var(--text-secondary); flex-shrink:0; }
        .telegram-verify-box{ width:100%; max-width:360px; margin-bottom:10px; }
        .telegram-widget-slot{ display:flex; justify-content:center; min-height:40px; margin:4px 0; }
        .verify-ok{ display:flex; align-items:center; gap:6px; justify-content:center; color:#1E9E5A; font-size:13.5px; font-weight:600; padding:8px 0; }
        .verify-hint{ font-size:12.5px; color:var(--text-secondary); text-align:center; padding:4px 0; }
        .verify-error{ font-size:12.5px; color:#E5484D; text-align:center; padding:4px 0; }
        .x-confirm-row{
          display:flex; align-items:flex-start; gap:10px; width:100%; max-width:360px;
          margin:2px 0 18px; font-size:13px; color:var(--text-secondary); text-align:left; cursor:pointer;
        }
        .x-confirm-row input{ margin-top:3px; flex-shrink:0; width:16px; height:16px; accent-color:#2E5EEA; }
        .unlock-confirm{
          margin-top:6px; width:100%; max-width:360px; padding:13px; border-radius:16px; border:none;
          background:linear-gradient(120deg,#2E5EEA,#4FC1E0,#6BE7B0); color:#fff; font-weight:600; font-size:14px; cursor:pointer;
        }
        .unlock-confirm:hover{ filter:brightness(1.06); }
        .unlock-confirm:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
        .topbar-avatar{
          width:34px; height:34px; border-radius:50%; flex-shrink:0;
          background:linear-gradient(135deg,#2E5EEA,#6BE7B0);
          display:flex; align-items:center; justify-content:center; color:#fff;
        }
        .icon-btn{
          width:40px; height:40px; border-radius:50%; border:none; background:transparent;
          display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--icon);
          transition:background .15s;
        }
        .icon-btn:hover{ background:var(--hover); }
        .recording-active{color:#d13c48!important;background:rgba(209,60,72,.12)!important;animation:recordPulse 1s ease-in-out infinite;}
@keyframes recordPulse{50%{transform:scale(1.06);}}
.msg-attachment-audio{display:block;width:min(280px,100%);margin-top:4px;}
.icon-btn.small{ width:34px; height:34px; -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background .15s, transform .08s; }
.icon-btn.small:active{ background:var(--hover); transform:scale(.92); }

        .scroll-area{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:0 16px; }

        /* Welcome */
        .welcome{ max-width:720px; margin:0 auto; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px 8px; animation:welcomeIn .45s ease both; }
        @keyframes welcomeIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
        .greeting{ font-size:clamp(26px, 5vw, 34px); font-weight:700; margin:0; color:var(--text); }
        .greeting-sub{ font-size:clamp(20px,3vw,28px); color:var(--text-secondary); margin:4px 0 32px; font-weight:400; }

        /* Messages */
        .messages{ max-width:720px; margin:0 auto; padding:16px 0 8px; display:flex; flex-direction:column; gap:18px; }
        .msg-row{ display:flex; gap:12px; align-items:flex-start; animation:fadeInUp .25s ease; }
        .msg-row.user{ justify-content:flex-end; }
        .avatar{ width:28px; height:28px; border-radius:50%; background:var(--avatar-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
        .msg-content{ display:flex; flex-direction:column; align-items:flex-start; min-width:0; max-width:78%; }
        .msg-row.user .msg-content{ align-items:flex-end; max-width:75%; }
        .img-gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:8px; max-width:420px; }
        .img-gallery-item{ display:block; border-radius:12px; overflow:hidden; aspect-ratio:1; background:var(--hover); }
        .img-gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .15s ease; }
        .img-gallery-item:hover img{ transform:scale(1.06); }
        .msg-actions{ display:flex; gap:4px; margin-top:2px; }
        .msg-action-btn{
          display:flex; align-items:center; gap:6px; padding:5px 9px; border:none; border-radius:8px;
          background:transparent; color:var(--text); font-size:12.5px; font-family:inherit;
          cursor:pointer; transition:background .15s ease;
        }
        .msg-action-btn:hover{ background:var(--hover); }
        .msg-action-btn span{ white-space:nowrap; }
        @media (max-width:480px){ .msg-action-btn span{ display:none; } }
        .bubble{ font-size:15px; line-height:1.6; word-wrap:break-word; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; cursor:default; }
        .bubble.user{ background:var(--bubble-user); padding:10px 16px; border-radius:20px; white-space:pre-wrap; color:var(--text); }
        .bubble.assistant{ padding-top:4px; color:var(--text); }
        .bubble.thinking{ display:flex; gap:4px; padding-top:10px; }
        .dot{ width:7px; height:7px; border-radius:50%; background:#4FC1E0; animation:dotPulse 1.2s ease-in-out infinite; }
        .dot:nth-child(2){ animation-delay:.15s; }
        .dot:nth-child(3){ animation-delay:.3s; }
        @keyframes dotPulse{ 0%,80%,100%{ opacity:.25; transform:scale(.85);} 40%{ opacity:1; transform:scale(1);} }
        @keyframes fadeInUp{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

        .msg-para{ margin:0 0 10px; }
        .msg-para:last-child{ margin-bottom:0; }
        .msg-list{ margin:4px 0 10px; padding-left:22px; }
        .msg-list li{ margin-bottom:4px; }
        .inline-code{ background:var(--code-inline-bg); color:var(--text); padding:1px 6px; border-radius:6px; font-family:'Sora', monospace; font-size:13.5px; }
        .msg-link{ color:#4FC1E0; text-decoration:underline; word-break:break-all; }
        .msg-code{ background:#1F1F1F; color:#E8EAED; padding:12px 14px; border-radius:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; font-size:13.5px; line-height:1.5; margin:6px 0 10px; }
        .msg-code code{ font-family:'Sora', monospace; white-space:pre; }
        .msg-math{ font-size:23px; line-height:1.7; font-weight:600; text-align:center; padding:18px 16px; }
        .msg-math code{ white-space:pre-wrap; }
        @media (max-width:480px){ .msg-math{ font-size:19px; padding:14px 12px; } }

        .spark-spin{ animation:sparkSpin 1.4s linear infinite; }
        @keyframes sparkSpin{ to{ transform:rotate(360deg);} }

        .error-box{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
        .msg-menu-overlay{ position:fixed; inset:0; z-index:300; background:transparent; }
        .msg-menu{
          position:fixed; min-width:170px; background:var(--surface); border:1px solid var(--border);
          border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.2); overflow:hidden;
          animation:msgMenuIn .12s ease both;
        }
        @keyframes msgMenuIn{ from{ opacity:0; transform:scale(.94);} to{ opacity:1; transform:scale(1);} }
        .msg-menu-item{
          display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; border:none;
          background:transparent; font-size:14px; color:var(--text); cursor:pointer; text-align:left; font-family:inherit;
        }
        .msg-menu-item:hover{ background:var(--hover); }
        .msg-menu-item + .msg-menu-item{ border-top:1px solid var(--border); }
        .msg-menu-item.danger{ color:#E5484D; }
        .msg-menu-item.danger:hover{ background:rgba(229,72,77,.1); }

        .attach-menu-overlay{ position:fixed; inset:0; z-index:300; background:transparent; }
        .attach-menu{
          position:fixed; min-width:206px; background:var(--surface); border:1px solid var(--border);
          border-radius:18px; box-shadow:0 16px 40px rgba(0,0,0,.24); overflow:hidden; padding:6px;
          transform-origin:bottom left; -webkit-tap-highlight-color:transparent;
          animation:attachMenuIn .22s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes attachMenuIn{
          from{ opacity:0; transform:scale(.9) translateY(8px); }
          to{ opacity:1; transform:scale(1) translateY(0); }
        }
        .attach-menu-item{
          display:flex; align-items:center; gap:12px; width:100%; padding:8px 10px; border:none; border-radius:13px;
          background:transparent; font-size:14.5px; font-family:inherit; color:var(--text); cursor:pointer; text-align:left;
          -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none;
          transition:background .12s ease, transform .08s ease;
        }
        .attach-menu-item:hover{ background:var(--hover); }
        .attach-menu-item:active{ background:var(--hover); transform:scale(.97); }
        .attach-menu-icon{
          width:36px; height:36px; border-radius:11px; background:var(--hover); color:var(--text);
          display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }

        .attach-preview{
          position:relative; display:inline-flex; max-width:160px; margin:0 auto 8px; padding:0;
        }
        .attach-preview-media{
          width:120px; height:80px; object-fit:cover; border-radius:14px; border:1px solid var(--border); display:block;
        }
        .attach-file-chip{
          display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface);
          border:1px solid var(--border); border-radius:14px; font-size:13px; color:var(--text); max-width:220px;
        }
        .attach-file-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .attach-remove{
          position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%;
          background:#1F1F1F; color:#fff; border:2px solid var(--bg0); display:flex; align-items:center;
          justify-content:center; cursor:pointer;
        }
        .attach-error{ text-align:center; font-size:12.5px; color:#E5484D; margin-bottom:6px; }

        .msg-attachment-image{
          display:block; max-width:240px; width:100%; border-radius:14px; margin-bottom:6px;
        }
        .msg-attachment-video{
          display:block; max-width:240px; width:100%; border-radius:14px; margin-bottom:6px;
        }
        .msg-attachment-file{
          display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--hover);
          border-radius:14px; font-size:13px; color:var(--text); margin-bottom:6px; max-width:240px;
        }

        .library-wrap{ padding:4px 4px 8px; }
        .library-empty{ font-size:13.5px; color:var(--text-secondary); text-align:center; padding:30px 14px; line-height:1.6; }
        .library-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
        .library-thumb{
          aspect-ratio:1; border:none; border-radius:10px; overflow:hidden; padding:0; cursor:pointer; background:var(--hover);
        }
        .library-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

        .lightbox-overlay{
          position:fixed; inset:0; z-index:400; background:rgba(0,0,0,.85);
          display:flex; align-items:center; justify-content:center; padding:24px;
        }
        .lightbox-image{ max-width:100%; max-height:100%; border-radius:12px; }
        .lightbox-close{
          position:absolute; top:max(16px, env(safe-area-inset-top)); right:16px;
          width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,.15);
          color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
        }
        .error-msg{ color:#E5484D; font-size:13px; text-align:center; }
        .retry-btn{ border:1px solid var(--border); background:var(--surface); border-radius:14px; padding:4px 12px; font-size:12.5px; cursor:pointer; color:#2E5EEA; }
        .retry-btn:hover{ background:var(--hover); }

        /* Input */
        .input-area{ max-width:720px; width:100%; margin:0 auto; padding:8px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); flex-shrink:0; box-sizing:border-box; }
        .input-pill{
          display:flex; align-items:center; gap:6px; background:var(--surface);
          border:1px solid transparent; border-radius:28px; padding:6px 8px 6px 14px;
          box-shadow:0 2px 10px rgba(30,70,120,.12);
          transition:border-color .2s ease, box-shadow .2s ease, background-color .3s ease;
        }
        .input-pill textarea{
          flex:1; border:none; background:transparent; resize:none; outline:none;
          font-family:inherit; font-size:15px; line-height:1.5; padding:8px 4px;
          min-height:39px; max-height:200px; color:var(--text);
          transition:height .12s ease;
          -webkit-appearance:none; appearance:none;
          -webkit-tap-highlight-color:transparent;
        }
        .input-pill textarea::placeholder{ color:var(--placeholder); }
        .send-btn{
          width:36px; height:36px; border-radius:50%; border:none; display:flex;
          align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
        }
        .send-btn.active{ background:linear-gradient(120deg,#2E5EEA,#4FC1E0,#6BE7B0); color:#fff; }
        .live-btn{
          width:36px; height:36px; border-radius:50%; border:none; flex-shrink:0;
          background:var(--live-bg); color:var(--text); display:flex; align-items:center; justify-content:center;
          cursor:pointer; transition:background .15s;
        }
        .live-btn:hover{ background:var(--live-bg-hover); }
        .disclaimer{ text-align:center; font-size:11px; color:var(--text-secondary); margin-top:8px; }

        button:focus-visible{ outline:2px solid #4285F4; outline-offset:2px; }
        button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .input-pill textarea:focus{ outline:none; box-shadow:none; }

        /* Settings / Help panel */
        .panel-overlay{ position:fixed; inset:0; background:var(--panel-overlay); z-index:60; display:flex; align-items:flex-end; justify-content:center; }

                      value={voiceVolume}
                      onChange={(e) => setVoiceVolume(parseFloat(e.target.value))}
                    />

                    <button
                      className={`voice-autocontinue-toggle ${voiceAutoContinue ? "on" : ""}`}
                      onClick={() => setVoiceAutoContinue((v) => !v)}
                      role="switch"
                      aria-checked={voiceAutoContinue}
                    >
                      <span>Продолжать разговор автоматически</span>
                      <span className="switch-pill"><span className="switch-knob" /></span>
                    </button>
                  </div>

                  <div className="settings-section">
                    <div className="settings-label">Аккаунт</div>
                    {account ? (
                      <React.Fragment>
                        <div className="account-row">
                          <div className="account-avatar">
                            {account.provider === "Apple" ? (
                              <AppleIcon size={18} />
                            ) : (
                              "G"
                            )}
                          </div>
                          <div>
                            <div className="account-name">
                              Вход через {account.provider}
                            </div>
                            <div className="account-hint">Демонстрационный вход</div>
                          </div>
                        </div>
                        <button className="logout-btn" onClick={() => setAccount(null)}>
                          <LogOut size={18} />
                          <span>Выйти из аккаунта</span>
                        </button>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <button
                          className="auth-btn"
                          onClick={() => setAccount({ provider: "Google" })}
                        >
                          <span className="google-g">G</span>
                          <span>Войти через Google</span>
                        </button>
                        <button
                          className="auth-btn"
                          onClick={() => setAccount({ provider: "Apple" })}
                        >
                          <AppleIcon size={18} />
                          <span>Войти через Apple</span>
                        </button>
                      </React.Fragment>
                    )}
                  </div>
                </React.Fragment>
              )}

              {currentPanel === "help" && (
                <button className="panel-row" onClick={() => pushPanel("privacy")}>
                  <HelpCircle size={18} />
                  <span>Конфиденциальность и защита данных</span>
                  <ChevronRight size={16} className="row-chevron" />
                </button>
              )}

              {currentPanel === "privacy" && (
                <div className="privacy-text">
                  {PRIVACY_PARAGRAPHS.map((p, i) => (
                    <p key={i}>{p}</p>
                  ))}
                </div>
              )}

              {currentPanel === "models" && (
                <div className="model-list">
                  {MODELS.map((m) => {
                    const unlocked = !m.locked || unlockedIds.includes(m.id);
                    const active = selectedModel.id === m.id;
                    return (
                      <button
                        key={m.id}
                        className={`model-row ${active ? "active" : ""}`}
                        onClick={() => handleSelectModel(m)}
                      >
                        <Spark size={18} />
                        <span className="model-name">{m.name}</span>
                        {unlocked ? (
                          active && <Check size={18} className="model-check" />
                        ) : (
                          <Lock size={16} className="model-lock" />
                        )}
                      </button>
                    );
                  })}
                </div>
              )}

              {currentPanel === "unlock" && pendingModel && (
                <div className="unlock-gate">
                  <div className="unlock-badge">
                    <Lock size={22} />
                  </div>
                  <div className="unlock-title">{pendingModel.name}</div>
                  <p className="unlock-text">
                    Чтобы получить модель <strong>{pendingModel.name}</strong>, подпишитесь на
                    Telegram-канал (подписка проверяется по-настоящему) и подтвердите подписку на X.
                  </p>

                  <a
                    className="social-card telegram"
                    href="https://t.me/securelinevpnbk"
                    onClick={(e) => {
                      e.preventDefault();
                      openExternal("https://t.me/securelinevpnbk");
                    }}
                  >
                    <span className="social-icon">
                      <TelegramIcon size={20} />
                    </span>
                    <span className="social-text">
                      <span className="social-name">Telegram</span>
                      <span className="social-handle">@securelinevpnbk</span>
                    </span>
                    <ChevronRight size={18} className="social-arrow" />
                  </a>

                  <div className="telegram-verify-box">
                    {telegramVerified ? (
                      <div className="verify-ok">
                        <Check size={16} />
                        <span>Подписка подтверждена{telegramUser && telegramUser.first_name ? ` — ${telegramUser.first_name}` : ""}</span>
                      </div>
                    ) : TELEGRAM_BOT_USERNAME.indexOf("REPLACE") !== -1 ? (
                      <div className="verify-hint">
                        Бот ещё не настроен — впишите TELEGRAM_BOT_USERNAME в файл (см. ИНСТРУКЦИЯ-TELEGRAM-BOT.txt).
                      </div>
                    ) : (
                      <React.Fragment>
                        <div ref={telegramWidgetRef} className="telegram-widget-slot" />
                        {telegramChecking && <div className="verify-hint">Проверяем подписку…</div>}
                        {telegramError && <div className="verify-error">{telegramError}</div>}
                      </React.Fragment>
                    )}
                  </div>

                  <a
                    className="social-card xapp"
                    href="https://x.com/securelinevpn?s=21"
                    onClick={(e) => {
                      e.preventDefault();
                      openExternal("https://x.com/securelinevpn?s=21");
                    }}
                  >
                    <span className="social-icon">
                      <BrandXIcon size={16} />
                    </span>
                    <span className="social-text">
                      <span className="social-name">X (Twitter)</span>
                      <span className="social-handle">@securelinevpn</span>
                    </span>
                    <ChevronRight size={18} className="social-arrow" />
                  </a>

                  <label className="x-confirm-row">
                    <input
                      type="checkbox"
                      checked={xConfirmed}
                      onChange={(e) => setXConfirmed(e.target.checked)}
                    />
                    <span>Я подписался на X (без автоматической проверки — честное слово)</span>
                  </label>

                  <button
                    className="unlock-confirm"
                    disabled={!telegramVerified || !xConfirmed}
                    onClick={handleConfirmUnlock}
                  >
                    {telegramVerified && xConfirmed ? "Разблокировать" : "Выполните оба условия выше"}
                  </button>
                </div>
              )}

              {currentPanel === "library" && (
                <div className="library-wrap">
                  {library.length === 0 ? (
                    <div className="library-empty">
                      Здесь будут появляться фото, которые вы отправляете в чат, и изображения,
                      которые сгенерирует Synra (генерация изображений пока не подключена).
                    </div>
                  ) : (
                    <div className="library-grid">
                      {library.map((item) => (
                        <button
                          key={item.id}
                          className="library-thumb"
                          onClick={() => setLibraryPreview(item)}
                        >
                          <img src={item.dataUrl} alt="" />
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {voiceOpen && (
        <div className="voice-overlay">
          <button
            className="voice-top-close"
            onClick={() => setVoiceOpen(false)}
            aria-label="Закрыть голосовой режим"
          >
            <XIcon size={20} />
          </button>

          <div className="voice-center">
            <div className={`voice-blob ${voiceListening ? "listening" : ""} ${voiceSpeakingRef.current ? "speaking" : ""}`} aria-hidden="true" />
            <div className="voice-status">{voiceStatus}</div>
            <div className="voice-hint">Говорите с Synra голосом — она ответит вслух</div>
          </div>

          <div className="voice-controls">
            <button
              className={`voice-icon-btn ${voiceListening ? "active" : ""}`}
              onClick={() => {
                if (voiceSpeakingRef.current) {
                  // Перебиваем Synra на полуслове и сразу слушаем — как в живом разговоре.
                  if (typeof window !== "undefined" && "speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                  }
                  voiceSpeakingRef.current = false;
                  startVoiceRecognition();
                } else if (voiceListening) {
                  stopVoiceRecognition();
                } else {
                  startVoiceRecognition();
                }
              }}
              aria-label={voiceListening ? "Остановить микрофон" : "Включить микрофон"}
            >
              <Mic size={20} />
            </button>
            {voiceSpeakingRef.current && (
              <button
                className="voice-icon-btn"
                onClick={() => {
                  if (typeof window !== "undefined" && "speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                  }
                  voiceSpeakingRef.current = false;
                  setVoiceStatus("Нажмите на микрофон и говорите");
                }}
                aria-label="Остановить озвучивание"
                title="Остановить озвучивание"
              >
                <StopIcon size={18} />
              </button>
            )}
            <button
              className="voice-icon-btn"
              onClick={() => setVoiceOpen(false)}
              aria-label="Закрыть"
            >
              <XIcon size={18} />
            </button>
          </div>
        </div>
      )}

      {messageMenu && (
        <div
          className="msg-menu-overlay"
          onClick={() => setMessageMenu(null)}
          onContextMenu={(e) => {
            e.preventDefault();
            setMessageMenu(null);
          }}
        >
          <div
            className="msg-menu"
            style={{
              left: Math.min(messageMenu.x, window.innerWidth - 190),
              top: Math.min(messageMenu.y, window.innerHeight - 120),
            }}
            onClick={(e) => e.stopPropagation()}
          >
            <button className="msg-menu-item" onClick={() => handleCopyMessage(messageMenu.text)}>
              <CopyIcon size={16} />
              <span>Скопировать</span>
            </button>
            {messageMenu.role === "user" && (
              <button className="msg-menu-item" onClick={() => handleEditMessage(messageMenu)}>
                <EditIcon size={16} />
                <span>Изменить</span>
              </button>
            )}
            <button
              className="msg-menu-item danger"
              onClick={() => handleDeleteMessage(messageMenu)}
            >
              <TrashIcon size={16} />
              <span>Удалить</span>
            </button>
          </div>
        </div>
      )}

      {attachMenuPos && (
        <div className="attach-menu-overlay" onClick={() => setAttachMenuPos(null)}>
          <div
            className="attach-menu"
            style={{ left: attachMenuPos.left, bottom: attachMenuPos.bottom }}
            onClick={(e) => e.stopPropagation()}
          >
            <button
              type="button"
              className="attach-menu-item"
              onClick={() => { setAttachMenuPos(null); cameraInputRef.current && cameraInputRef.current.click(); }}
            >
              <span className="attach-menu-icon"><CameraIcon size={18} /></span>
              <span>Камера</span>
            </button>
            <button
              type="button"
              className="attach-menu-item"
              onClick={() => { setAttachMenuPos(null); photoInputRef.current && photoInputRef.current.click(); }}
            >
              <span className="attach-menu-icon"><ImageIcon size={18} /></span>
              <span>Фото</span>
            </button>
            <button
              type="button"
              className="attach-menu-item"
              onClick={() => { setAttachMenuPos(null); fileInputRef.current && fileInputRef.current.click(); }}
            >
              <span className="attach-menu-icon"><FileIcon size={18} /></span>
              <span>Файл</span>
            </button>
          </div>
        </div>
      )}

      {libraryPreview && (
        <div className="lightbox-overlay" onClick={() => setLibraryPreview(null)}>
          <button
            className="lightbox-close"
            onClick={() => setLibraryPreview(null)}
            aria-label="Закрыть"
          >
            <XIcon size={20} />
          </button>
          <img className="lightbox-image" src={libraryPreview.dataUrl} alt="" />
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
