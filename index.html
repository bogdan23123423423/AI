/* ---------- lightweight markdown-style rendering for assistant replies ---------- */

function formatInline(text, keyPrefix) {
  const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter((p) => p !== "");
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={`${keyPrefix}-b-${i}`}>{part.slice(2, -2)}</strong>;
    }
    if (part.startsWith("`") && part.endsWith("`")) {
      return (
        <code key={`${keyPrefix}-c-${i}`} className="inline-code">
          {part.slice(1, -1)}
        </code>
      );
    }
    return <span key={`${keyPrefix}-t-${i}`}>{part}</span>;
  });
}

function renderMessageBody(text) {
  const blocks = [];
  const codeRegex = /```([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  let blockIndex = 0;

  const pushTextBlock = (chunk, keyBase) => {
    const lines = chunk.split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
          i++;
        }
        blocks.push(
          <ul className="msg-list" key={`${keyBase}-ul-${i}`}>
            {items.map((it, idx) => (
              <li key={idx}>{formatInline(it, `${keyBase}-ul-${i}-${idx}`)}</li>
            ))}
          </ul>
        );
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
          i++;
        }
        blocks.push(
          <ol className="msg-list" key={`${keyBase}-ol-${i}`}>
            {items.map((it, idx) => (
              <li key={idx}>{formatInline(it, `${keyBase}-ol-${i}-${idx}`)}</li>
            ))}
          </ol>
        );
        continue;
      }
      if (line.trim() === "") {
        i++;
        continue;
      }
      const paraLines = [line];
      i++;
      while (
        i < lines.length &&
        lines[i].trim() !== "" &&
        !/^\s*[-*]\s+/.test(lines[i]) &&
        !/^\s*\d+\.\s+/.test(lines[i])
      ) {
        paraLines.push(lines[i]);
        i++;
      }
      blocks.push(
        <p className="msg-para" key={`${keyBase}-p-${i}`}>
          {paraLines.map((pl, idx) => (
            <span key={idx}>
              {formatInline(pl, `${keyBase}-p-${i}-${idx}`)}
              {idx < paraLines.length - 1 && <br />}
            </span>
          ))}
        </p>
      );
    }
  };

  while ((match = codeRegex.exec(text)) !== null) {
    const before = text.slice(lastIndex, match.index);
    if (before) pushTextBlock(before, `b${blockIndex++}`);
    const codeContent = match[1].replace(/^[a-zA-Z]*\n/, "");
    blocks.push(
      <pre className="msg-code" key={`code-${blockIndex++}`}>
        <code>{codeContent}</code>
      </pre>
    );
    lastIndex = codeRegex.lastIndex;
  }
  const rest = text.slice(lastIndex);
  if (rest) pushTextBlock(rest, `b${blockIndex++}`);

  return blocks;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("read failed"));
    reader.readAsDataURL(file);
  });
}

function getVideoDuration(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const videoEl = document.createElement("video");
    videoEl.preload = "metadata";
    videoEl.onloadedmetadata = () => {
      URL.revokeObjectURL(url);
      resolve(videoEl.duration);
    };
    videoEl.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("video load error"));
    };
    videoEl.src = url;
  });
}

function resizeImageToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      if (width > maxDim || height > maxDim) {
        if (width >= height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("image load error"));
    };
    img.src = url;
  });
}

Если пользователь просит выполнить задачу — помоги выполнить её.
Не придумывай факты, если не уверен в них; если данных недостаточно, честно скажи об этом.
Отвечай на языке пользователя.
Старайся давать практичные, понятные и хорошо структурированные ответы.`;

// Старые переменные оставлены для совместимости с существующими функциями
// разблокировки моделей/Telegram, но отправка сообщений больше не зависит от Worker.
const WORKER_URL = "https://REPLACE-ME.workers.dev";
const APP_SECRET = "REPLACE-ME";
const TELEGRAM_BOT_USERNAME = "REPLACE-BOT-USERNAME";

// Языки распознавания/озвучивания голосового режима.
const VOICE_LANGS = { ru: "ru-RU", en: "en-US", es: "es-ES" };
const VOICE_LANG_LABELS = { ru: "Русский", en: "English", es: "Español" };

function openExternal(url) {
  const win = window.open(url, "_blank", "noopener,noreferrer");
  if (!win) {
    window.location.href = url;
  }
}

const STORAGE_KEY = "synra_state_v1";

function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function savePersisted(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (err) {
    // localStorage недоступен (например, в песочнице предпросмотра) — просто не сохраняем
  }
}

const GREETINGS = ["Ваш ход!", "Чем могу помочь?", "Здравствуйте!", "Рад нашей встречи!"];
const pickGreeting = () => GREETINGS[Math.floor(Math.random() * GREETINGS.length)];

let chatIdCounter = 1;
const makeChat = () => ({
  id: chatIdCounter++,
  title: "Новый чат",
  messages: [],
  greeting: pickGreeting(),
});

function App() {
  const persisted = loadPersisted();

  const [chats, setChats] = useState(() => {
    if (persisted && Array.isArray(persisted.chats) && persisted.chats.length > 0) {
      const maxId = persisted.chats.reduce((m, c) => Math.max(m, c.id || 0), 0);
      chatIdCounter = maxId + 1;
      return persisted.chats;
    }
    return [makeChat()];
  });
  const [activeId, setActiveId] = useState(() => {
    if (
      persisted &&
      persisted.activeId &&
      persisted.chats &&
      persisted.chats.some((c) => c.id === persisted.activeId)
    ) {
      return persisted.activeId;
    }
    return chats[0].id;
  });
  const [input, setInput] = useState("");
  const [isLoading, setIsLoading] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(() =>
    typeof window !== "undefined" ? window.innerWidth > 768 : true
  );
  const [error, setError] = useState(null);
  const [lastFailed, setLastFailed] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");

  const [voiceOpen, setVoiceOpen] = useState(false);
  const [voiceListening, setVoiceListening] = useState(false);
  const [voiceStatus, setVoiceStatus] = useState("Нажмите на микрофон и говорите");
  const [voiceLang, setVoiceLang] = useState(() =>
    persisted && VOICE_LANGS[persisted.voiceLang] ? persisted.voiceLang : "ru"
  );
  const [voiceRate, setVoiceRate] = useState(() =>
    persisted && typeof persisted.voiceRate === "number" ? persisted.voiceRate : 0.96
  );
  const [voiceVolume, setVoiceVolume] = useState(() =>
    persisted && typeof persisted.voiceVolume === "number" ? persisted.voiceVolume : 1
  );
  const [voiceAutoContinue, setVoiceAutoContinue] = useState(() =>
    persisted && typeof persisted.voiceAutoContinue === "boolean" ? persisted.voiceAutoContinue : true
  );
  const [voiceVoiceURI, setVoiceVoiceURI] = useState(() =>
    persisted && typeof persisted.voiceVoiceURI === "string" ? persisted.voiceVoiceURI : ""
  );
  const [availableVoices, setAvailableVoices] = useState([]);
  const voiceRecognitionRef = useRef(null);
  const voiceManuallyStoppedRef = useRef(false);
  const voiceSpeakingRef = useRef(false);
  const voicePitchRef = useRef(1.03);
  const voiceOpenRef = useRef(false);
  const sendMessageRef = useRef(null);
  const voiceBestVoiceRef = useRef(null);
  const voiceGotResultRef = useRef(false);
  const voiceRestartTimerRef = useRef(null);
  const voiceLangRef = useRef(voiceLang);
  const voiceRateRef = useRef(voiceRate);
  const voiceVolumeRef = useRef(voiceVolume);
  const voiceAutoContinueRef = useRef(voiceAutoContinue);
  const voiceVoiceURIRef = useRef(voiceVoiceURI);
  const [isRecordingGS, setIsRecordingGS] = useState(false);
  const mediaRecorderRef = useRef(null);
  const recordingChunksRef = useRef([]);
  const [splashVisible, setSplashVisible] = useState(true);
  const [splashMounted, setSplashMounted] = useState(true);
  const [theme, setTheme] = useState(() =>
    persisted && (persisted.theme === "light" || persisted.theme === "dark") ? persisted.theme : "light"
  );
  const [panelStack, setPanelStack] = useState([]);
  const [account, setAccount] = useState(null);
  const [selectedModel, setSelectedModel] = useState(() => {
    if (persisted && persisted.selectedModelId) {
      const found = MODELS.find((m) => m.id === persisted.selectedModelId);
      if (found) return found;
    }
    return MODELS[0];
  });
  const [unlockedIds, setUnlockedIds] = useState(() =>
    persisted && Array.isArray(persisted.unlockedIds) ? persisted.unlockedIds : []
  );
  const [pendingModel, setPendingModel] = useState(null);
  const [telegramUser, setTelegramUser] = useState(null);
  const [telegramVerified, setTelegramVerified] = useState(false);
  const [telegramChecking, setTelegramChecking] = useState(false);
  const [telegramError, setTelegramError] = useState(null);
  const [xConfirmed, setXConfirmed] = useState(false);
  const telegramWidgetRef = useRef(null);

  const scrollRef = useRef(null);
  const textareaRef = useRef(null);
  const longPressTimer = useRef(null);
  const pressStartPos = useRef({ x: 0, y: 0 });
  const [messageMenu, setMessageMenu] = useState(null);
  const [pendingAttachment, setPendingAttachment] = useState(null);
  const [attachError, setAttachError] = useState(null);
  const [attachBusy, setAttachBusy] = useState(false);
  const [library, setLibrary] = useState(() =>
    persisted && Array.isArray(persisted.library) ? persisted.library : []
  );
  const [libraryPreview, setLibraryPreview] = useState(null);
  const fileInputRef = useRef(null);

  const activeChat = chats.find((c) => c.id === activeId) || chats[0];
  const messages = activeChat.messages;
  const currentPanel = panelStack[panelStack.length - 1] || null;

  useEffect(() => {
    const hideTimer = setTimeout(() => setSplashVisible(false), 2000);
    const unmountTimer = setTimeout(() => setSplashMounted(false), 2350);
    return () => {
      clearTimeout(hideTimer);
      clearTimeout(unmountTimer);
    };
  }, []);

  // На iPhone (особенно в режиме "На экран Домой") .shell позиционируется
  // как position:fixed на весь экран, но сам html/body по умолчанию белый.
  // Если реальная высота экрана хоть на пиксель разойдётся с viewport (это
  // и есть причина белой полосы снизу), под интерфейсом будет видно именно
  // фон html/body. Поэтому держим его синхронизированным с нижним цветом
  // градиента SYNRA для текущей темы — тогда никакого белого не видно.
  useLayoutEffect(() => {
    const bg = theme === "dark" ? "#182233" : "#a9d3f7";
    document.documentElement.style.backgroundColor = bg;
    document.body.style.backgroundColor = bg;
  }, [theme]);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [messages, isLoading]);

  useEffect(() => {
    const ta = textareaRef.current;
    if (ta) {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
    }
  }, [input]);

  useEffect(() => {
    if (typeof document !== "undefined" && document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        const ta = textareaRef.current;
        if (ta) {
          ta.style.height = "auto";
          ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
        }
      });
    }
  }, []);

  const updateChat = (id, updater) => {
    setChats((prev) => prev.map((c) => (c.id === id ? updater(c) : c)));
  };

  const closeSidebarOnMobile = () => {
    if (typeof window !== "undefined" && window.innerWidth <= 768) {
      setSidebarOpen(false);
    }
  };

  const handleNewChat = () => {
    const chat = makeChat();
    setChats((prev) => [chat, ...prev]);
    setActiveId(chat.id);
    setInput("");
    setError(null);
    setLastFailed(null);
    closeSidebarOnMobile();
  };

  const handleDeleteChat = (chatId) => {
    setChats((prev) => {
      const remaining = prev.filter((c) => c.id !== chatId);
      if (remaining.length === 0) {
        const fresh = makeChat();
        setActiveId(fresh.id);
        return [fresh];
      }
      if (chatId === activeId) {
        setActiveId(remaining[0].id);
        setInput("");
        setError(null);
        setLastFailed(null);
      }
      return remaining;
    });
    closeSidebarOnMobile();
  };

  const pushPanel = (p) => setPanelStack((s) => [...s, p]);
  const popPanel = () => setPanelStack((s) => s.slice(0, -1));
  const closePanel = () => setPanelStack([]);

  const handleSelectModel = (model) => {
    const unlocked = !model.locked || unlockedIds.includes(model.id);
    if (!unlocked) {
      setPendingModel(model);
      setTelegramUser(null);
      setTelegramVerified(false);
      setTelegramError(null);
      setXConfirmed(false);
      pushPanel("unlock");
      return;
    }
    setSelectedModel(model);
    closePanel();
  };

  const handleConfirmUnlock = () => {
    if (pendingModel) {
      setUnlockedIds((prev) => [...prev, pendingModel.id]);
      setSelectedModel(pendingModel);
    }
    closePanel();
  };

  const handleTelegramAuth = useCallback(async (user) => {
    setTelegramUser(user);
    setTelegramChecking(true);
    setTelegramError(null);
    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Secret": APP_SECRET },
        body: JSON.stringify({ action: "verify-telegram", telegramAuth: user }),
      });
      const data = await response.json();
      if (data.verified) {
        setTelegramVerified(true);
      } else {
        setTelegramVerified(false);
        setTelegramError(
          data.error || "Похоже, вы не подписаны на канал. Подпишитесь и попробуйте ещё раз."
        );
      }
    } catch (err) {
      setTelegramVerified(false);
      setTelegramError("Не удалось проверить подписку — проверьте настройку бэкенда.");
    } finally {
      setTelegramChecking(false);
    }
  }, []);

  useEffect(() => {
    window.onTelegramAuth = handleTelegramAuth;
    return () => {
      delete window.onTelegramAuth;
    };
  }, [handleTelegramAuth]);

  useEffect(() => {
    if (
      currentPanel === "unlock" &&
      !telegramVerified &&
      telegramWidgetRef.current &&
      TELEGRAM_BOT_USERNAME.indexOf("REPLACE") === -1
    ) {
      telegramWidgetRef.current.innerHTML = "";
      const script = document.createElement("script");
      script.src = "https://telegram.org/js/telegram-widget.js?22";
      script.async = true;
      script.setAttribute("data-telegram-login", TELEGRAM_BOT_USERNAME);
      script.setAttribute("data-size", "large");
      script.setAttribute("data-radius", "12");
      script.setAttribute("data-onauth", "onTelegramAuth(user)");
      script.setAttribute("data-request-access", "write");
      telegramWidgetRef.current.appendChild(script);
    }
  }, [currentPanel, telegramVerified]);

  const pickBestVoiceForLang = useCallback((langCode) => {
    if (typeof window === "undefined" || !("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || !voices.length) return null;
    const bcp = VOICE_LANGS[langCode] || "ru-RU";
    const prefix = bcp.split("-")[0];
    const re = new RegExp(`^${prefix}(-|_)`, "i");
    const rePrefixOnly = new RegExp(`^${prefix}`, "i");
    const langVoices = voices.filter((v) => re.test(v.lang));
    return (
      langVoices.find((v) => /google/i.test(v.name)) ||
      langVoices.find((v) => /microsoft|neural|online/i.test(v.name)) ||
      langVoices.find((v) => /yandex|alena|milena|pavel|irina|katya|dmitry/i.test(v.name)) ||
      langVoices[0] ||
      voices.find((v) => rePrefixOnly.test(v.lang)) ||
      voices[0] ||
      null
    );
  }, []);

  const speakVoiceReply = useCallback((text) => {
    if (!text || typeof window === "undefined" || !("speechSynthesis" in window)) return;

    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(
        String(text).replace(/[*_`#>]/g, "").replace(/\n+/g, " ").trim()
      );

      const voices = window.speechSynthesis.getVoices();
      let preferred = null;
      if (voiceVoiceURIRef.current) {
        preferred = voices.find((v) => v.voiceURI === voiceVoiceURIRef.current) || null;
      }
      if (!preferred) preferred = voiceBestVoiceRef.current;
      if (!preferred) {
        preferred = pickBestVoiceForLang(voiceLangRef.current);
        if (preferred) voiceBestVoiceRef.current = preferred;
      }
      if (preferred) utterance.voice = preferred;
      utterance.lang = VOICE_LANGS[voiceLangRef.current] || "ru-RU";

      // Нейтральный/андрогинный тембр: средняя высота + пользовательский темп/громкость.
      utterance.pitch = voicePitchRef.current;
      utterance.rate = voiceRateRef.current;
      utterance.volume = voiceVolumeRef.current;

      voiceSpeakingRef.current = true;
      setVoiceStatus("Synra отвечает…");
      utterance.onend = () => {
        voiceSpeakingRef.current = false;
        if (voiceOpenRef.current && !voiceManuallyStoppedRef.current && voiceAutoContinueRef.current) {
          setVoiceStatus("Слушаю…");
          voiceGotResultRef.current = false;
          setVoiceListening(true);
          try { voiceRecognitionRef.current && voiceRecognitionRef.current.start(); } catch (_) {}
        } else {
          setVoiceStatus("Нажмите на микрофон и говорите");
        }
      };
      utterance.onerror = () => {
        voiceSpeakingRef.current = false;
        setVoiceStatus("Нажмите на микрофон и говорите");
      };
      window.speechSynthesis.speak(utterance);
    } catch (err) {
      console.error("Synra: ошибка синтеза речи", err);
    }
  }, [voiceOpen, pickBestVoiceForLang]);

  const sendMessage = useCallback(
    async (rawText, attachmentArg) => {
      const text = (rawText || "").trim();
      const attachment = attachmentArg !== undefined ? attachmentArg : pendingAttachment;
      if ((!text && !attachment) || isLoading) return;

      const chatId = activeId;
      const userMsg = { role: "user", text, attachment: attachment || null };

      // Yandex GPT Chat Completions использует OpenAI-совместимый формат
      // сообщений: role + content. Передаём историю текущего чата, но
      // ограничиваем её размер, чтобы запрос не рос бесконечно.
      const MAX_CONTEXT_MESSAGES = 40;
      const MAX_CONTEXT_CHARS = 60000;
      const rawHistory = [...messages, userMsg];
      let history = rawHistory.slice(-MAX_CONTEXT_MESSAGES);
      let totalChars = 0;
      history = history
        .slice()
        .reverse()
        .filter((m) => {
          const value = typeof m.text === "string" ? m.text : "";
          const size = value.length;
          if (totalChars + size > MAX_CONTEXT_CHARS && totalChars > 0) return false;
          totalChars += size;
          return true;
        })
        .reverse();

      const historyForApi = history.map((m) => {
        const baseText = typeof m.text === "string" ? m.text : "";

        // Текущий выбранный yandexgpt — текстовая модель. Не отправляем
        // старый Anthropic-формат изображений, который был нужен Worker.
        // Само вложение при этом продолжает сохраняться и отображаться в UI.
        if (m.attachment && m.attachment.type === "image") {
          const prefix = baseText ? `${baseText}\n\n` : "";
          return {
            role: m.role,
            content: `${prefix}[Пользователь прикрепил изображение: ${m.attachment.name || "изображение"}. Текущая модель Synra подключена в текстовом режиме и не анализирует это изображение.]`,
          };
        }

        if (m.attachment && m.attachment.type === "file") {
          const prefix = baseText ? `${baseText}\n\n` : "";
          return {
            role: m.role,
            content: `${prefix}[Пользователь прикрепил файл: ${m.attachment.name || "файл"}. Содержимое файла не передаётся модели в этой версии.]`,
          };
        }

        if (m.attachment && m.attachment.type === "video") {
          const prefix = baseText ? `${baseText}\n\n` : "";
          return {
            role: m.role,
            content: `${prefix}[Пользователь прикрепил видео: ${m.attachment.name || "видео"}. Содержимое видео не передаётся модели в этой версии.]`,
          };
        }

        return { role: m.role, content: baseText };
      });

      updateChat(chatId, (c) => ({
        ...c,
        title: c.messages.length === 0 ? (text || "Вложение").slice(0, 32) : c.title,
        messages: [...c.messages, userMsg],
      }));

      if (attachment && attachment.type === "image") {
        setLibrary((prev) =>
          [
            {
              id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
              dataUrl: attachment.dataUrl,
              name: attachment.name,
              source: "user",
              ts: Date.now(),
            },
            ...prev,
          ].slice(0, 60)
        );
      }

      setInput("");
      setPendingAttachment(null);
      setAttachError(null);
      setError(null);
      setLastFailed(null);
      setIsLoading(true);

      try {
        const response = await fetch(SYNRA_BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: YANDEX_MODEL,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              ...historyForApi,
            ],
            temperature: 0.3,
            max_tokens: 2000,
            stream: false,
          }),
        });

        const responseText = await response.text();
        let data = null;
        try {
          data = responseText ? JSON.parse(responseText) : null;
        } catch (parseError) {
          console.error("Synra: Yandex GPT вернул невалидный JSON —", parseError, responseText);
        }

        if (!response.ok) {
          const serverMessage =
            (data && data.error && data.error.message) ||
            (data && data.message) ||
            responseText ||
            `HTTP ${response.status}`;
          const error = new Error(`HTTP ${response.status}: ${serverMessage}`);
          error.status = response.status;
          throw error;
        }

        const replyText =
          data &&
          data.choices &&
          data.choices[0] &&
          data.choices[0].message &&
          data.choices[0].message.content;
        if (typeof replyText !== "string" || !replyText.trim()) {
          throw new Error("Yandex GPT вернул пустой ответ или ответ в неожиданном формате.");
        }

        const cleanReplyText = replyText.trim();
        updateChat(chatId, (c) => ({
          ...c,
          messages: [...c.messages, { role: "assistant", text: cleanReplyText }],
        }));
        if (voiceOpen) {
          speakVoiceReply(cleanReplyText);
        }
      } catch (err) {
        console.error("Synra: ошибка запроса к Yandex GPT —", err);
        setLastFailed(text);

        const status = err && err.status;
        let friendly = "Не удалось получить ответ от Яндекс GPT. Проверьте интернет и настройки API.";
        if (status === 401) {
          friendly = "Яндекс GPT отклонил API-ключ (401). Проверьте ключ и его права доступа.";
        } else if (status === 403) {
          friendly = "Доступ к Яндекс GPT запрещён (403). Проверьте роль сервисного аккаунта, область действия API-ключа и YANDEX_FOLDER_ID.";
        } else if (status === 404) {
          friendly = "Модель или каталог не найдены (404). Проверьте YANDEX_FOLDER_ID и название модели.";
        } else if (status === 429) {
          friendly = "Яндекс GPT временно ограничил запросы (429). Попробуйте немного позже.";
        } else if (status >= 500) {
          friendly = "Сервис Яндекс GPT временно недоступен. Попробуйте ещё раз позже.";
        } else if (err instanceof TypeError) {
          friendly = "Браузер не смог выполнить запрос к Яндекс GPT. Если это CORS-ошибка, для публичного сайта потребуется serverless/backend-прокси.";
        }

        setError(friendly);
      } finally {
        setIsLoading(false);
      }
    },
    [activeId, messages, isLoading, pendingAttachment, voiceOpen, speakVoiceReply]
  );

  useEffect(() => {
    sendMessageRef.current = sendMessage;
  }, [sendMessage]);

  useEffect(() => {
    voiceOpenRef.current = voiceOpen;
  }, [voiceOpen]);

  useEffect(() => {
    if (typeof window === "undefined" || !("speechSynthesis" in window)) return;
    const refreshVoices = () => {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return;
      setAvailableVoices(voices);
      const best = pickBestVoiceForLang(voiceLangRef.current);
      if (best) voiceBestVoiceRef.current = best;
    };
    refreshVoices();
    window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
    return () => window.speechSynthesis.removeEventListener("voiceschanged", refreshVoices);
  }, [pickBestVoiceForLang]);

  useEffect(() => {
    voiceLangRef.current = voiceLang;
    if (voiceRecognitionRef.current) {
      try { voiceRecognitionRef.current.lang = VOICE_LANGS[voiceLang] || "ru-RU"; } catch (_) {}
    }
    const best = pickBestVoiceForLang(voiceLang);
    if (best) voiceBestVoiceRef.current = best;
  }, [voiceLang, pickBestVoiceForLang]);

  useEffect(() => { voiceRateRef.current = voiceRate; }, [voiceRate]);
  useEffect(() => { voiceVolumeRef.current = voiceVolume; }, [voiceVolume]);
  useEffect(() => { voiceAutoContinueRef.current = voiceAutoContinue; }, [voiceAutoContinue]);
  useEffect(() => { voiceVoiceURIRef.current = voiceVoiceURI; }, [voiceVoiceURI]);

  const clearLongPressTimer = () => {
    if (longPressTimer.current) {
      clearTimeout(longPressTimer.current);
      longPressTimer.current = null;
    }
  };

  const openMessageMenu = (point, chatId, msgIndex, role, text) => {
    setMessageMenu({ chatId, msgIndex, role, text, x: point.clientX, y: point.clientY });
  };

  const handleMsgPointerDown = (e, chatId, msgIndex, role, text) => {
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    pressStartPos.current = { x: point.clientX, y: point.clientY };
    clearLongPressTimer();
    longPressTimer.current = setTimeout(() => {
      openMessageMenu(point, chatId, msgIndex, role, text);
    }, 500);
  };

  const handleMsgPointerMove = (e) => {
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    const dx = Math.abs(point.clientX - pressStartPos.current.x);
    const dy = Math.abs(point.clientY - pressStartPos.current.y);
    if (dx > 10 || dy > 10) clearLongPressTimer();
  };

  const handleMsgPointerUp = () => {
    clearLongPressTimer();
  };

  const handleMsgContextMenu = (e, chatId, msgIndex, role, text) => {
    e.preventDefault();
    clearLongPressTimer();
    openMessageMenu(e, chatId, msgIndex, role, text);
  };

  const handleCopyMessage = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (err2) {
        console.error("Synra: copy failed", err2);
      }
    }
    setMessageMenu(null);
  };

  const handleEditMessage = (menu) => {
    updateChat(menu.chatId, (c) => ({
      ...c,
      messages: c.messages.slice(0, menu.msgIndex),
    }));
    setInput(menu.text);
    setMessageMenu(null);
    setTimeout(() => {
      if (textareaRef.current) textareaRef.current.focus();
    }, 50);
  };

  const handleDeleteMessage = (menu) => {
    updateChat(menu.chatId, (c) => ({
      ...c,
      messages: c.messages.filter((_, idx) => idx !== menu.msgIndex),
    }));
    setMessageMenu(null);
  };

  const handleFileSelected = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    const isImage = file.type.startsWith("image/");
    const isVideo = file.type.startsWith("video/");

    if (file.size > 20 * 1024 * 1024) {
      setAttachError("Файл слишком большой (максимум 20 МБ).");
      return;
    }

    setAttachBusy(true);
    setAttachError(null);

    try {
      if (isVideo) {
        const duration = await getVideoDuration(file);
        if (duration > 10.5) {
          setAttachError("Видео можно прикрепить не длиннее 10 секунд.");
          setAttachBusy(false);
          return;
        }
        const dataUrl = await fileToDataUrl(file);
        setPendingAttachment({ type: "video", dataUrl, name: file.name, mime: file.type });
      } else if (isImage) {
        const dataUrl = await resizeImageToDataUrl(file, 1280, 0.82);
        setPendingAttachment({ type: "image", dataUrl, name: file.name, mime: "image/jpeg" });
      } else {
        const dataUrl = await fileToDataUrl(file);
        setPendingAttachment({ type: "file", dataUrl, name: file.name, mime: file.type, size: file.size });
      }
    } catch (err) {
      setAttachError("Не удалось прочитать файл.");
    } finally {
      setAttachBusy(false);
    }
  };

  const startGSRecording = useCallback(async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      setVoiceStatus("Запись ГС не поддерживается этим браузером");
      return;
    }
    if (isRecordingGS) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      const recorder = new MediaRecorder(stream, { mimeType: mime });
      recordingChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) recordingChunksRef.current.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach((track) => track.stop());
        const blob = new Blob(recordingChunksRef.current, { type: mime });
        const url = URL.createObjectURL(blob);
        updateChat(activeId, (c) => ({
          ...c,
          messages: [...c.messages, { role: "user", text: "", attachment: { type: "audio", url, name: "Голосовое сообщение", mime, size: blob.size } }]
        }));
        setIsRecordingGS(false);
      };
      recorder.onerror = () => {
        stream.getTracks().forEach((track) => track.stop());
        setIsRecordingGS(false);
      };
      mediaRecorderRef.current = recorder;
      recorder.start();
      setIsRecordingGS(true);
    } catch (err) {
      console.error("Synra: ошибка записи ГС", err);
      setIsRecordingGS(false);
    }
  }, [activeId, isRecordingGS, updateChat]);

  const stopGSRecording = useCallback(() => {
    const recorder = mediaRecorderRef.current;
    if (recorder && recorder.state !== "inactive") recorder.stop();
    mediaRecorderRef.current = null;
    setIsRecordingGS(false);
  }, []);

  const startVoiceRecognition = useCallback(() => {
    if (typeof window === "undefined") return;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      setVoiceStatus("Голосовой ввод не поддерживается этим браузером");
      return;
    }
    if (voiceSpeakingRef.current) return;

    if (voiceRestartTimerRef.current) {
      clearTimeout(voiceRestartTimerRef.current);
      voiceRestartTimerRef.current = null;
    }

    if (!voiceRecognitionRef.current) {
      const recognition = new Recognition();
      recognition.lang = VOICE_LANGS[voiceLangRef.current] || "ru-RU";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        voiceGotResultRef.current = false;
        setVoiceListening(true);
        setVoiceStatus("Слушаю…");
      };

      recognition.onresult = (event) => {
        const transcript = event.results && event.results[0] && event.results[0][0] && event.results[0][0].transcript ? String(event.results[0][0].transcript).trim() : "";
        if (!transcript) return;
        voiceGotResultRef.current = true;
        setVoiceListening(false);
        setVoiceStatus("Отправляю…");
        voiceManuallyStoppedRef.current = false;
        if (sendMessageRef.current) sendMessageRef.current(transcript);
      };

      recognition.onerror = (event) => {
        setVoiceListening(false);
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          voiceManuallyStoppedRef.current = true;
          setVoiceStatus("Разрешите доступ к микрофону в браузере");
          return;
        }
        if (event.error === "aborted") return;
        // Пауза/тишина и похожие временные ошибки — не прерываем диалог,
        // а тихо продолжаем слушать, как в настоящем голосовом режиме.
        if (voiceOpenRef.current && !voiceManuallyStoppedRef.current && !voiceSpeakingRef.current) {
          setVoiceStatus("Слушаю…");
          voiceRestartTimerRef.current = setTimeout(() => startVoiceRecognition(), 400);
        } else {
          setVoiceStatus("Нажмите на микрофон и говорите");
        }
      };

      recognition.onend = () => {
        setVoiceListening(false);
        if (
          !voiceGotResultRef.current &&
          voiceOpenRef.current &&
          !voiceManuallyStoppedRef.current &&
          !voiceSpeakingRef.current
        ) {
          // Ничего не расслышали — не заставляем нажимать микрофон заново,
          // просто продолжаем слушать дальше.
          voiceRestartTimerRef.current = setTimeout(() => startVoiceRecognition(), 400);
        }
      };

      voiceRecognitionRef.current = recognition;
    }

    voiceManuallyStoppedRef.current = false;
    try {
      voiceRecognitionRef.current.start();
    } catch (_) {
      setVoiceListening(true);
      setVoiceStatus("Слушаю…");
    }
  }, []);

  const stopVoiceRecognition = useCallback(() => {
    voiceManuallyStoppedRef.current = true;
    if (voiceRestartTimerRef.current) {
      clearTimeout(voiceRestartTimerRef.current);
      voiceRestartTimerRef.current = null;
    }
    setVoiceListening(false);
    if (voiceRecognitionRef.current) {
      try { voiceRecognitionRef.current.stop(); } catch (_) {}
    }
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    voiceSpeakingRef.current = false;
    setVoiceStatus("Нажмите на микрофон и говорите");
  }, []);

  useEffect(() => {
    if (!voiceOpen) {
      stopVoiceRecognition();
      return;
    }
    voiceManuallyStoppedRef.current = false;
    const timer = setTimeout(() => startVoiceRecognition(), 250);
    return () => clearTimeout(timer);
  }, [voiceOpen, startVoiceRecognition, stopVoiceRecognition]);

  useEffect(() => {
    return () => {
      if (voiceRestartTimerRef.current) clearTimeout(voiceRestartTimerRef.current);
      try { voiceRecognitionRef.current && voiceRecognitionRef.current.stop(); } catch (_) {}
      if (typeof window !== "undefined" && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    };
  }, []);

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input);
    }
  };

  const historyChats = chats.filter((c) => c.messages.length > 0);
  const trimmedQuery = searchQuery.trim().toLowerCase();
  const visibleChats = trimmedQuery
    ? historyChats.filter((c) => {
        if (c.title.toLowerCase().includes(trimmedQuery)) return true;
        return c.messages.some((m) => m.text.toLowerCase().includes(trimmedQuery));
      })
    : historyChats;

  useEffect(() => {
    savePersisted({
      chats,
      activeId,
      selectedModelId: selectedModel.id,
      unlockedIds,
      theme,
      library,
      voiceLang,
      voiceRate,
      voiceVolume,
      voiceAutoContinue,
      voiceVoiceURI,
    });
  }, [

    activeId,
    selectedModel,

    theme,
    library,
    voiceLang,
    voiceRate,

    voiceAutoContinue,

            </div>
          )}
        </div>

        <div className="input-area">
          <input
            type="file"
            ref={fileInputRef}
            accept="image/*,video/*,.pdf,.doc,.docx,.txt"
            style={{ display: "none" }}
            onChange={handleFileSelected}
          />

          {pendingAttachment && (
            <div className="attach-preview">
              {pendingAttachment.type === "image" && (
                <img className="attach-preview-media" src={pendingAttachment.dataUrl} alt="" />
              )}
              {pendingAttachment.type === "video" && (
                <video className="attach-preview-media" src={pendingAttachment.dataUrl} muted />
              )}
              {pendingAttachment.type === "file" && (
                <div className="attach-file-chip">
                  <FileIcon size={16} />
                  <span>{pendingAttachment.name}</span>
                </div>
              )}
              <button
                className="attach-remove"
                onClick={() => setPendingAttachment(null)}
                aria-label="Убрать вложение"
              >
                <XIcon size={13} />
              </button>
            </div>
          )}
          {attachError && <div className="attach-error">{attachError}</div>}

          <div className="input-pill">
            <button
              className="icon-btn small"
              aria-label="Добавить"
              disabled={attachBusy}
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
            >
              <Plus size={20} />
            </button>
            <textarea
              ref={textareaRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Спросить Synra"
              rows={1}
            />
            {input.trim() || pendingAttachment ? (
              <button
                className="send-btn active"
                onClick={() => sendMessage(input)}
                aria-label="Отправить"
              >
                <Send size={18} />
              </button>
            ) : (
              <React.Fragment>
                <button
                  className="live-btn"
                  aria-label="Голосовой режим"
                  title="Общение с Synra голосом"
                  onClick={() => setVoiceOpen(true)}
                >
                  <AudioLines size={18} />
                </button>
              </React.Fragment>
            )}
          </div>
          <div className="disclaimer">
            Synra может ошибаться. Проверяйте важную информацию.
          </div>
        </div>
      </main>

      {panelStack.length > 0 && (
        <div className="panel-overlay" onClick={closePanel}>
          <div
            className="panel-sheet"
            role="dialog"
            aria-modal="true"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="panel-header">
              {panelStack.length > 1 ? (
                <button className="icon-btn" onClick={popPanel} aria-label="Назад">
                  <ChevronLeft size={20} />
                </button>
              ) : (
                <div style={{ width: 40 }} />
              )}
              <div className="panel-title">{panelTitle(currentPanel, pendingModel)}</div>
              <button className="icon-btn" onClick={closePanel} aria-label="Закрыть">
                <XIcon size={20} />
              </button>
            </div>

            <div className="panel-body">
              {currentPanel === "menu" && (
                <React.Fragment>
                  <button className="panel-row" onClick={() => pushPanel("settings")}>
                    <SettingsIcon size={18} />
                    <span>Настройки</span>
                    <ChevronRight size={16} className="row-chevron" />
                  </button>
                  <button className="panel-row" onClick={() => pushPanel("help")}>
                    <HelpCircle size={18} />
                    <span>Справка</span>
                    <ChevronRight size={16} className="row-chevron" />
                  </button>
                </React.Fragment>
              )}

              {currentPanel === "settings" && (
                <React.Fragment>
                  <div className="settings-section">
                    <div className="settings-label">Тема</div>
                    <div className="theme-toggle">
                      <button
                        className={`theme-btn ${theme === "light" ? "active" : ""}`}
                        onClick={() => setTheme("light")}
                      >
                        <Sun size={16} />
                        <span>Светлая</span>
                      </button>
                      <button
                        className={`theme-btn ${theme === "dark" ? "active" : ""}`}
                        onClick={() => setTheme("dark")}
                      >
                        <Moon size={16} />
                        <span>Тёмная</span>
                      </button>
                    </div>
                  </div>

                  <div className="settings-section">
                    <div className="settings-label">Голос</div>

                    <div className="settings-row-label">Язык распознавания и озвучивания</div>
                    <div className="theme-toggle">
                      {Object.keys(VOICE_LANGS).map((code) => (
                        <button
                          key={code}
                          className={`theme-btn ${voiceLang === code ? "active" : ""}`}
                          onClick={() => setVoiceLang(code)}
                        >
                          <span>{VOICE_LANG_LABELS[code]}</span>
                        </button>
                      ))}
                    </div>

                    <div className="settings-row-label">Голос озвучивания</div>
                    <select
                      className="voice-select"
                      value={voiceVoiceURI}
                      onChange={(e) => setVoiceVoiceURI(e.target.value)}
                    >
                      <option value="">Автоматически (рекомендуется)</option>
                      {availableVoices
                        .filter((v) => v.lang && v.lang.toLowerCase().startsWith(VOICE_LANGS[voiceLang].split("-")[0]))
                        .map((v) => (
                          <option key={v.voiceURI} value={v.voiceURI}>{v.name}</option>
                        ))}
                    </select>

                    <div className="settings-row-label">Скорость речи: {voiceRate.toFixed(2)}×</div>
                    <input
                      type="range"
                      className="voice-slider"
                      min="0.6"
                      max="1.6"
                      step="0.02"
                      value={voiceRate}
                      onChange={(e) => setVoiceRate(parseFloat(e.target.value))}
                    />

                    <div className="settings-row-label">Громкость: {Math.round(voiceVolume * 100)}%</div>
                    <input
                      type="range"
                      className="voice-slider"
                      min="0"
                      max="1"
                      step="0.05"
                      value={voiceVolume}
                      onChange={(e) => setVoiceVolume(parseFloat(e.target.value))}
                    />

                    <button
                      className={`voice-autocontinue-toggle ${voiceAutoContinue ? "on" : ""}`}
                      onClick={() => setVoiceAutoContinue((v) => !v)}
                      role="switch"
                      aria-checked={voiceAutoContinue}
                    >
                      <span>Продолжать разговор автоматически</span>
                      <span className="switch-pill"><span className="switch-knob" /></span>
                    </button>
                  </div>

                  <div className="settings-section">
                    <div className="settings-label">Аккаунт</div>
                    {account ? (
                      <React.Fragment>
                        <div className="account-row">
                          <div className="account-avatar">
                            {account.provider === "Apple" ? (
                              <AppleIcon size={18} />
                            ) : (
                              "G"
                            )}
                          </div>
                          <div>
                            <div className="account-name">
                              Вход через {account.provider}
                            </div>
                            <div className="account-hint">Демонстрационный вход</div>
                          </div>
                        </div>
                        <button className="logout-btn" onClick={() => setAccount(null)}>
                          <LogOut size={18} />
                          <span>Выйти из аккаунта</span>
                        </button>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <button
                          className="auth-btn"
                          onClick={() => setAccount({ provider: "Google" })}
                        >
                          <span className="google-g">G</span>
                          <span>Войти через Google</span>
                        </button>
                        <button
                          className="auth-btn"
                          onClick={() => setAccount({ provider: "Apple" })}
                        >
                          <AppleIcon size={18} />
                          <span>Войти через Apple</span>
                        </button>
                      </React.Fragment>
                    )}
                  </div>
                </React.Fragment>
              )}

              {currentPanel === "help" && (
                <button className="panel-row" onClick={() => pushPanel("privacy")}>
                  <HelpCircle size={18} />
                  <span>Конфиденциальность и защита данных</span>
                  <ChevronRight size={16} className="row-chevron" />
                </button>
              )}

              {currentPanel === "privacy" && (
                <div className="privacy-text">
                  {PRIVACY_PARAGRAPHS.map((p, i) => (
                    <p key={i}>{p}</p>
                  ))}
                </div>
              )}

              {currentPanel === "models" && (
                <div className="model-list">
                  {MODELS.map((m) => {
                    const unlocked = !m.locked || unlockedIds.includes(m.id);
                    const active = selectedModel.id === m.id;
                    return (
                      <button
                        key={m.id}
                        className={`model-row ${active ? "active" : ""}`}
                        onClick={() => handleSelectModel(m)}
                      >
                        <Spark size={18} />
                        <span className="model-name">{m.name}</span>
                        {unlocked ? (
                          active && <Check size={18} className="model-check" />
                        ) : (
                          <Lock size={16} className="model-lock" />
                        )}
                      </button>
                    );
                  })}
                </div>
              )}

              {currentPanel === "unlock" && pendingModel && (
                <div className="unlock-gate">
                  <div className="unlock-badge">
                    <Lock size={22} />
                  </div>
                  <div className="unlock-title">{pendingModel.name}</div>
                  <p className="unlock-text">
                    Чтобы получить модель <strong>{pendingModel.name}</strong>, подпишитесь на
                    Telegram-канал (подписка проверяется по-настоящему) и подтвердите подписку на X.
                  </p>

                  <a
                    className="social-card telegram"
                    href="https://t.me/securelinevpnbk"
                    onClick={(e) => {
                      e.preventDefault();
                      openExternal("https://t.me/securelinevpnbk");
                    }}
                  >
                    <span className="social-icon">
                      <TelegramIcon size={20} />
                    </span>
                    <span className="social-text">
                      <span className="social-name">Telegram</span>
                      <span className="social-handle">@securelinevpnbk</span>
                    </span>
                    <ChevronRight size={18} className="social-arrow" />
                  </a>

                  <div className="telegram-verify-box">
                    {telegramVerified ? (
                      <div className="verify-ok">
                        <Check size={16} />
                        <span>Подписка подтверждена{telegramUser && telegramUser.first_name ? ` — ${telegramUser.first_name}` : ""}</span>
                      </div>
                    ) : TELEGRAM_BOT_USERNAME.indexOf("REPLACE") !== -1 ? (
                      <div className="verify-hint">
                        Бот ещё не настроен — впишите TELEGRAM_BOT_USERNAME в файл (см. ИНСТРУКЦИЯ-TELEGRAM-BOT.txt).
                      </div>
                    ) : (
                      <React.Fragment>
                        <div ref={telegramWidgetRef} className="telegram-widget-slot" />
                        {telegramChecking && <div className="verify-hint">Проверяем подписку…</div>}
                        {telegramError && <div className="verify-error">{telegramError}</div>}
                      </React.Fragment>
                    )}
                  </div>

                  <a
                    className="social-card xapp"
                    href="https://x.com/securelinevpn?s=21"
                    onClick={(e) => {
                      e.preventDefault();
                      openExternal("https://x.com/securelinevpn?s=21");
                    }}
                  >
                    <span className="social-icon">
                      <BrandXIcon size={16} />
                    </span>
                    <span className="social-text">
                      <span className="social-name">X (Twitter)</span>
                      <span className="social-handle">@securelinevpn</span>
                    </span>
                    <ChevronRight size={18} className="social-arrow" />
                  </a>

                  <label className="x-confirm-row">
                    <input
                      type="checkbox"
                      checked={xConfirmed}
                      onChange={(e) => setXConfirmed(e.target.checked)}
                    />
                    <span>Я подписался на X (без автоматической проверки — честное слово)</span>
                  </label>

                  <button
                    className="unlock-confirm"
                    disabled={!telegramVerified || !xConfirmed}
                    onClick={handleConfirmUnlock}
                  >
                    {telegramVerified && xConfirmed ? "Разблокировать" : "Выполните оба условия выше"}
                  </button>
                </div>
              )}

              {currentPanel === "library" && (
                <div className="library-wrap">
                  {library.length === 0 ? (
                    <div className="library-empty">
                      Здесь будут появляться фото, которые вы отправляете в чат, и изображения,
                      которые сгенерирует Synra (генерация изображений пока не подключена).
                    </div>
                  ) : (
                    <div className="library-grid">
                      {library.map((item) => (
                        <button
                          key={item.id}
                          className="library-thumb"
                          onClick={() => setLibraryPreview(item)}
                        >
                          <img src={item.dataUrl} alt="" />
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {voiceOpen && (
        <div className="voice-overlay">
          <button
            className="voice-top-close"
            onClick={() => setVoiceOpen(false)}
            aria-label="Закрыть голосовой режим"
          >
            <XIcon size={20} />
          </button>

          <div className="voice-center">
            <div className={`voice-blob ${voiceListening ? "listening" : ""} ${voiceSpeakingRef.current ? "speaking" : ""}`} aria-hidden="true" />
            <div className="voice-status">{voiceStatus}</div>
            <div className="voice-hint">Говорите с Synra голосом — она ответит вслух</div>
          </div>

          <div className="voice-controls">
            <button
              className={`voice-icon-btn ${voiceListening ? "active" : ""}`}
              onClick={() => {
                if (voiceSpeakingRef.current) {
                  // Перебиваем Synra на полуслове и сразу слушаем — как в живом разговоре.
                  if (typeof window !== "undefined" && "speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                  }
                  voiceSpeakingRef.current = false;
                  startVoiceRecognition();
                } else if (voiceListening) {
                  stopVoiceRecognition();
                } else {
                  startVoiceRecognition();
                }
              }}
              aria-label={voiceListening ? "Остановить микрофон" : "Включить микрофон"}
            >
              <Mic size={20} />
            </button>
            {voiceSpeakingRef.current && (
              <button
                className="voice-icon-btn"
                onClick={() => {
                  if (typeof window !== "undefined" && "speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                  }
                  voiceSpeakingRef.current = false;
                  setVoiceStatus("Нажмите на микрофон и говорите");
                }}
                aria-label="Остановить озвучивание"
                title="Остановить озвучивание"
              >
                <StopIcon size={18} />
              </button>
            )}
            <button
              className="voice-icon-btn"
              onClick={() => setVoiceOpen(false)}
              aria-label="Закрыть"
            >
              <XIcon size={18} />
            </button>
          </div>
        </div>
      )}

      {messageMenu && (
        <div
          className="msg-menu-overlay"
          onClick={() => setMessageMenu(null)}
          onContextMenu={(e) => {
            e.preventDefault();
            setMessageMenu(null);
          }}
        >
          <div
            className="msg-menu"
            style={{
              left: Math.max(20, Math.min(messageMenu.x, window.innerWidth - 240)),
              top: Math.max(20, Math.min(messageMenu.y, window.innerHeight - 180)),
            }}
            onClick={(e) => e.stopPropagation()}
          >
            <button className="msg-menu-item" onClick={() => handleCopyMessage(messageMenu.text)}>
              <CopyIcon size={16} />
              <span>Скопировать</span>
            </button>
            {messageMenu.role === "user" && (
              <button className="msg-menu-item" onClick={() => handleEditMessage(messageMenu)}>
                <EditIcon size={16} />
                <span>Изменить</span>
              </button>
            )}
            <button
              className="msg-menu-item danger"
              onClick={() => handleDeleteMessage(messageMenu)}
            >
              <TrashIcon size={16} />
              <span>Удалить</span>
            </button>
          </div>
        </div>
      )}

      {libraryPreview && (
        <div className="lightbox-overlay" onClick={() => setLibraryPreview(null)}>
          <button
            className="lightbox-close"
            onClick={() => setLibraryPreview(null)}
            aria-label="Закрыть"
          >
            <XIcon size={20} />
          </button>
          <img className="lightbox-image" src={libraryPreview.dataUrl} alt="" />
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
